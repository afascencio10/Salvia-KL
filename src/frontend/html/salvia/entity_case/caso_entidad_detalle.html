<style>
.ced-page { max-width: 960px; margin: 0 auto; padding: 24px 16px; font-family: 'Nunito Sans', sans-serif; }
.ced-breadcrumb { font-size: .85rem; color: #6b7280; margin-bottom: 16px; }
.ced-breadcrumb a { color: #5106A7; text-decoration: none; font-weight: 600; }
.ced-breadcrumb a:hover { text-decoration: underline; }

.ced-header { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.ced-header-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ced-entity-icon { width: 44px; height: 44px; border-radius: 10px; background: #ede9fe; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #5106A7; flex-shrink: 0; }
.ced-entity-name { font-size: 1.15rem; font-weight: 700; color: #111827; margin: 0; }
.ced-subtitle { font-size: .85rem; color: #6b7280; margin: 4px 0 0; }

.ced-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.ced-badge { font-size: .72rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; text-transform: capitalize; }
.ced-badge--sector { background: #ede9fe; color: #5106A7; }
.ced-badge--risk-extremo { background: #fef2f2; color: #991b1b; }
.ced-badge--risk-alto { background: #fff7ed; color: #9a3412; }
.ced-badge--risk-moderado, .ced-badge--risk-medio { background: #fefce8; color: #854d0e; }
.ced-badge--risk-bajo { background: #f0fdf4; color: #166534; }
.ced-badge--risk- { display: none; }

.ced-tabs { display: flex; gap: 0; border-bottom: 2px solid #e5e7eb; margin-bottom: 20px; overflow-x: auto; }
.ced-tab { padding: 10px 18px; font-size: .85rem; font-weight: 600; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; }
.ced-tab:hover { color: #5106A7; }
.ced-tab--active { color: #5106A7; border-bottom-color: #5106A7; }

.ced-card { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.ced-card-title { font-size: .9rem; font-weight: 700; color: #374151; margin: 0 0 14px; }

.ced-case-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ced-avatar { width: 38px; height: 38px; border-radius: 50%; background: #5106A7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .95rem; flex-shrink: 0; }
.ced-case-name { font-size: .95rem; font-weight: 700; color: #111827; margin: 0; }
.ced-case-meta { font-size: .82rem; color: #6b7280; margin: 2px 0 0; }
.ced-case-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ced-badge-status { font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 12px; background: #f3f4f6; color: #374151; }
.ced-badge-status--activo { background: #d1fae5; color: #065f46; }
.ced-badge-status--cerrado { background: #e5e7eb; color: #374151; }
.ced-badge-status--vencido { background: #fef2f2; color: #991b1b; }
.ced-badge-status--novedad { background: #fef3c7; color: #92400e; }

.ced-entity-row { margin-bottom: 10px; }
.ced-entity-label { font-size: .78rem; font-weight: 600; color: #6b7280; margin: 0 0 2px; text-transform: uppercase; letter-spacing: .3px; }
.ced-entity-value { font-size: .9rem; color: #111827; margin: 0 0 8px; }
.ced-entity-value i { color: #9ca3af; margin-right: 4px; }

.ced-objetivo-text { font-size: .9rem; color: #374151; line-height: 1.5; margin: 0; white-space: pre-wrap; }
.ced-empty-text { font-size: .85rem; color: #9ca3af; font-style: italic; margin: 0; }

.ced-counts { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
.ced-count-item { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: #374151; }
.ced-count-item i { color: #5106A7; }
.ced-count-num { font-weight: 700; }

.ced-loading { text-align: center; padding: 60px 0; color: #6b7280; }
.ced-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top-color: #5106A7; border-radius: 50%; animation: ced-spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes ced-spin { to { transform: rotate(360deg); } }

.ced-error-block { text-align: center; padding: 80px 20px; }
.ced-error-card { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 40px 32px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }

.ced-toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 20px; border-radius: 8px; font-size: .85rem; font-weight: 600; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: ced-fadeIn .3s ease; }
.ced-toast--info { background: #3b82f6; }
.ced-toast--error { background: #ef4444; }
@keyframes ced-fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

.ced-proximamente { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: .9rem; }
</style>

<main class="salvia-main">
<div id="app" class="ced-page">

    <div v-if="toast.visible" class="ced-toast" :class="'ced-toast--' + toast.type">
        ${ toast.message }
    </div>

    <!-- Breadcrumb -->
    <div class="ced-breadcrumb">
        <a href="/salvia/casos-entidad">← Casos Entidad</a>
        <span> / </span>
        <span v-if="detail">${ detail.entityBranchName }</span>
        <span v-else>Detalle</span>
    </div>

    <!-- Loading -->
    <div v-if="loading" class="ced-loading">
        <span class="ced-spinner" aria-hidden="true"></span>
        <span>Cargando detalle…</span>
    </div>

    <!-- Error -->
    <div v-if="error && !loading" class="ced-error-block">
        <div class="ced-error-card">
            <div style="font-size:3rem;margin-bottom:12px">⚠️</div>
            <p style="font-size:1.1rem;font-weight:700;color:#111827;margin:0 0 8px">
                ${ errorTitle }
            </p>
            <p style="font-size:.85rem;color:#6b7280;margin:0 0 20px;line-height:1.5">
                ${ errorMessage }
            </p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                <a href="/salvia/casos-entidad" style="padding:10px 20px;border-radius:8px;font-size:.85rem;background:#f3f4f6;color:#374151;text-decoration:none;font-weight:600">
                    ← Volver al listado
                </a>
                <button v-if="errorCode !== 404" type="button" @click="fetchDetail" style="padding:10px 20px;border-radius:8px;font-size:.85rem;background:#5106A7;color:#fff;border:none;font-weight:600;cursor:pointer">
                    🔄 Reintentar
                </button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <template v-if="detail && !loading">

        <!-- Header -->
        <div class="ced-header">
            <div class="ced-header-top">
                <div class="ced-entity-icon">
                    <i class="fas fa-building"></i>
                </div>
                <div style="flex:1">
                    <p class="ced-entity-name">${ detail.entityBranchName }</p>
                    <p class="ced-subtitle">
                        ${ detail.victimFullName }
                        <span v-if="detail.city || detail.departmentName"> · </span>
                        ${ detail.city }${ detail.city && detail.departmentName ? ', ' : '' }${ detail.departmentName }
                    </p>
                </div>
            </div>
            <div class="ced-badges">
                <span v-if="detail.sectorLabel" class="ced-badge ced-badge--sector">${ detail.sectorLabel }</span>
                <span v-if="detail.riskLevel" class="ced-badge" :class="'ced-badge--risk-' + detail.riskLevel.toLowerCase()">${ detail.riskLevel }</span>
            </div>
            <div class="ced-counts">
                <div class="ced-count-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Oficios: <span class="ced-count-num">${ detail.oficiosCount }</span></span>
                </div>
                <div class="ced-count-item">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Barreras activas: <span class="ced-count-num">${ detail.barrerasCount }</span></span>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="ced-tabs">
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'info' }" @click="activeTab = 'info'">Info General</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'barreras' }" @click="activeTab = 'barreras'">Barreras</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'acciones' }" @click="activeTab = 'acciones'">Acciones Institucionales</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'notificaciones' }" @click="activeTab = 'notificaciones'">Notificaciones</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'timeline' }" @click="activeTab = 'timeline'">Timeline</button>
        </div>

        <!-- Tab: Info General -->
        <div v-if="activeTab === 'info'">

            <!-- Card: Información del caso -->
            <div class="ced-card">
                <p class="ced-card-title">Información del caso</p>
                <div class="ced-case-row">
                    <div class="ced-avatar">${ detail.victimFullName ? detail.victimFullName.charAt(0).toUpperCase() : '?' }</div>
                    <div style="flex:1">
                        <p class="ced-case-name">${ detail.victimFullName }</p>
                        <div class="ced-case-badges">
                            <span v-if="detail.riskLevel" class="ced-badge" :class="'ced-badge--risk-' + detail.riskLevel.toLowerCase()">${ detail.riskLevel }</span>
                            <span class="ced-badge-status" :class="statusBadgeClass(detail.caseStatusLabel)">${ detail.caseStatusLabel }</span>
                        </div>
                        <p class="ced-case-meta">
                            ${ detail.caseCode }
                            <span v-if="detail.city"> · ${ detail.city }</span>
                            <span v-if="detail.departmentName">, ${ detail.departmentName }</span>
                            <span v-if="detail.agentName"> · ${ detail.agentName }</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Card: Datos de la entidad -->
            <div class="ced-card">
                <p class="ced-card-title">Datos de la entidad</p>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Sector</p>
                    <p class="ced-entity-value">${ detail.sectorLabel || detail.sector || '—' }</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Sede</p>
                    <p class="ced-entity-value">${ detail.entityBranchName }</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Ubicación</p>
                    <p class="ced-entity-value">
                        <i class="fas fa-map-marker-alt"></i>
                        ${ detail.townName || '' }${ detail.townName && detail.entityCityName ? ', ' : '' }${ detail.entityCityName || '' }${ detail.entityCityName && detail.entityDeptName ? ', ' : '' }${ detail.entityDeptName || '' }
                        <span v-if="!detail.townName && !detail.entityCityName && !detail.entityDeptName">No registra</span>
                    </p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Dirección</p>
                    <p class="ced-entity-value">${ detail.address || 'No registra' }</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Teléfono</p>
                    <p class="ced-entity-value" style="color:#9ca3af;font-style:italic">No registra</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Correo</p>
                    <p class="ced-entity-value" style="color:#9ca3af;font-style:italic">No registra</p>
                </div>
            </div>

            <!-- Card: Objetivo con la entidad -->
            <div class="ced-card">
                <p class="ced-card-title">Objetivo con la entidad</p>
                <p v-if="detail.objetivo" class="ced-objetivo-text">${ detail.objetivo }</p>
                <p v-else class="ced-empty-text">Sin objetivo registrado</p>
            </div>

            <!-- Card: Checklist entidad (placeholder) -->
            <div class="ced-card">
                <p class="ced-card-title">Checklist entidad</p>
                <p class="ced-empty-text">No hay checklist configurado para esta entidad</p>
            </div>
        </div>

        <!-- Other tabs: Próximamente -->
        <div v-if="activeTab !== 'info'" class="ced-proximamente">
            <i class="fas fa-tools" style="font-size:1.5rem;margin-bottom:8px;display:block"></i>
            Próximamente
        </div>

    </template>
</div>
</main>

{{ template "standard_scripts.html" . }}
{{ template "overlay.html" . }}

<script>
    window.__CasoEntidadDetalleConfig = {
        entityCaseId: "{{.entityCaseId}}",
        entityBranchId: {{.entityBranchId}},
        windowTitle: {{.windowTitle}},
        currentUser: "{{.currentUser}}",
        currentRole: "{{.currentRole}}",
        menu: {{.menu}}
    };
</script>
<script src="/static/js/components/caso-entidad-detalle.js"></script>
