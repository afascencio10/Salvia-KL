<!-- Los estilos de esta pantalla van en archivo, como el resto: un <style>
     dentro de la plantilla no sigue el patron del proyecto. -->
<link rel="stylesheet" href="/static/css/caso-entidad-detalle.css">

<main class="salvia-main">
<div id="app" class="ced-page">

    <div v-if="toast.visible" class="ced-toast" :class="'ced-toast--' + toast.type">
        ${ toast.message }
    </div>

    <!-- Breadcrumb -->
    <div class="ced-breadcrumb">
        <a href="/salvia/casos-entidad">← Casos Entidad</a>
        <span> / </span>
        <span v-if="detail">${ detail.entityBranchName }</span>
        <span v-else>Detalle</span>
    </div>

    <!-- Loading -->
    <div v-if="loading" class="ced-loading">
        <span class="ced-spinner" aria-hidden="true"></span>
        <span>Cargando detalle…</span>
    </div>

    <!-- Error -->
    <div v-if="error && !loading" class="ced-error-block">
        <div class="ced-error-card">
            <div style="font-size:3rem;margin-bottom:12px">⚠️</div>
            <p style="font-size:1.1rem;font-weight:700;color:#111827;margin:0 0 8px">
                ${ errorTitle }
            </p>
            <p style="font-size:.85rem;color:#6b7280;margin:0 0 20px;line-height:1.5">
                ${ errorMessage }
            </p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                <a href="/salvia/casos-entidad" style="padding:10px 20px;border-radius:8px;font-size:.85rem;background:#f3f4f6;color:#374151;text-decoration:none;font-weight:600">
                    ← Volver al listado
                </a>
                <button v-if="errorCode !== 404" type="button" @click="fetchDetail" style="padding:10px 20px;border-radius:8px;font-size:.85rem;background:#5106A7;color:#fff;border:none;font-weight:600;cursor:pointer">
                    🔄 Reintentar
                </button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <template v-if="detail && !loading">

        <!-- Header -->
        <div class="ced-header">
            <div class="ced-header-top">
                <div class="ced-entity-icon">
                    <i class="fas fa-building"></i>
                </div>
                <div style="flex:1">
                    <p class="ced-entity-name">${ detail.entityBranchName }</p>
                    <p class="ced-subtitle">
                        ${ detail.victimFullName }
                        <span v-if="detail.city || detail.departmentName"> · </span>
                        ${ detail.city }${ detail.city && detail.departmentName ? ', ' : '' }${ detail.departmentName }
                    </p>
                </div>
            </div>
            <div class="ced-badges">
                <span v-if="detail.sectorLabel" class="ced-badge ced-badge--sector">${ detail.sectorLabel }</span>
                <span v-if="detail.riskLevel" class="ced-badge" :class="'ced-badge--risk-' + detail.riskLevel.toLowerCase()">${ detail.riskLevel }</span>
            </div>
            <div class="ced-counts">
                <div class="ced-count-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Oficios: <span class="ced-count-num">${ detail.oficiosCount }</span></span>
                </div>
                <div class="ced-count-item">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Barreras activas: <span class="ced-count-num">${ detail.barrerasCount }</span></span>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="ced-tabs">
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'info' }" @click="activeTab = 'info'">Info General</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'barreras' }" @click="activeTab = 'barreras'">Barreras</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'acciones' }" @click="activeTab = 'acciones'">Acciones Institucionales</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'notificaciones' }" @click="activeTab = 'notificaciones'">Notificaciones</button>
            <button type="button" class="ced-tab" :class="{ 'ced-tab--active': activeTab === 'timeline' }" @click="activeTab = 'timeline'">Timeline</button>
        </div>

        <!-- Tab: Info General -->
        <div v-if="activeTab === 'info'">

            <!-- Card: Información del caso -->
            <div class="ced-card">
                <p class="ced-card-title">Información del caso</p>
                <div class="ced-case-row">
                    <div class="ced-avatar">${ detail.victimFullName ? detail.victimFullName.charAt(0).toUpperCase() : '?' }</div>
                    <div style="flex:1">
                        <p class="ced-case-name">${ detail.victimFullName }</p>
                        <div class="ced-case-badges">
                            <span v-if="detail.riskLevel" class="ced-badge" :class="'ced-badge--risk-' + detail.riskLevel.toLowerCase()">${ detail.riskLevel }</span>
                            <span class="ced-badge-status" :class="statusBadgeClass(detail.caseStatusLabel)">${ detail.caseStatusLabel }</span>
                        </div>
                        <p class="ced-case-meta">
                            ${ detail.caseCode }
                            <span v-if="detail.city"> · ${ detail.city }</span>
                            <span v-if="detail.departmentName">, ${ detail.departmentName }</span>
                            <span v-if="detail.agentName"> · ${ detail.agentName }</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Card: Datos de la entidad -->
            <div class="ced-card">
                <p class="ced-card-title">Datos de la entidad</p>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Sector</p>
                    <p class="ced-entity-value">${ detail.sectorLabel || detail.sector || '—' }</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Sede</p>
                    <p class="ced-entity-value">${ detail.entityBranchName }</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Ubicación</p>
                    <p class="ced-entity-value">
                        <i class="fas fa-map-marker-alt"></i>
                        ${ detail.townName || '' }${ detail.townName && detail.entityCityName ? ', ' : '' }${ detail.entityCityName || '' }${ detail.entityCityName && detail.entityDeptName ? ', ' : '' }${ detail.entityDeptName || '' }
                        <span v-if="!detail.townName && !detail.entityCityName && !detail.entityDeptName">No registra</span>
                    </p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Dirección</p>
                    <p class="ced-entity-value">${ detail.address || 'No registra' }</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Teléfono</p>
                    <p class="ced-entity-value" style="color:#9ca3af;font-style:italic">No registra</p>
                </div>
                <div class="ced-entity-row">
                    <p class="ced-entity-label">Correo</p>
                    <p class="ced-entity-value" style="color:#9ca3af;font-style:italic">No registra</p>
                </div>
            </div>

            <!-- Card: Objetivo con la entidad -->
            <div class="ced-card">
                <p class="ced-card-title">Objetivo con la entidad</p>
                <p v-if="detail.objetivo" class="ced-objetivo-text">${ detail.objetivo }</p>
                <p v-else class="ced-empty-text">Sin objetivo registrado</p>
            </div>

            <!-- Card: Checklist entidad -->
            <div class="ced-card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                    <p class="ced-card-title" style="margin:0">Checklist entidad</p>
                    <span v-if="obligacionesTotal > 0" style="font-size:.78rem;font-weight:700;color:#5106A7;background:#f5f3ff;border-radius:12px;padding:3px 10px">
                        ${ obligacionesCompletadas }/${ obligacionesTotal } completadas
                    </span>
                </div>
                <div v-if="cargandoObligaciones" class="ced-empty-text">Cargando checklist...</div>
                <p v-else-if="obligacionesTotal === 0" class="ced-empty-text">No hay checklist configurado para esta entidad</p>
                <div v-else style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
                    <div v-for="o in obligaciones" :key="o.id" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px">
                        <span v-if="o.status === 'completada'" style="width:20px;height:20px;border-radius:50%;background:#dcfce7;color:#16a34a;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0">✓</span>
                        <span v-else style="width:20px;height:20px;border-radius:50%;background:#fee2e2;border:2px solid #fca5a5;display:inline-block;flex-shrink:0"></span>
                        <span style="font-size:.85rem;color:#374151" :style="o.status === 'completada' ? 'text-decoration:line-through;color:#9ca3af' : ''">${ o.label }</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Other tabs: Próximamente -->
        <div v-if="activeTab !== 'info'" class="ced-proximamente">
            <i class="fas fa-tools" style="font-size:1.5rem;margin-bottom:8px;display:block"></i>
            Próximamente
        </div>

    </template>
</div>
</main>

{{ template "standard_scripts.html" . }}
{{ template "overlay.html" . }}

<script>
    window.__CasoEntidadDetalleConfig = {
        entityCaseId: "{{.entityCaseId}}",
        entityBranchId: {{.entityBranchId}},
        windowTitle: {{.windowTitle}},
        currentUser: "{{.currentUser}}",
        currentRole: "{{.currentRole}}",
        menu: {{.menu}}
    };
</script>
<script src="/static/js/components/caso-entidad-detalle.js"></script>
