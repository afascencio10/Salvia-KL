{{ define "salvia/list-cases/consolidated_report_modal.html" }}
<style>
/* Estilos mínimos indispensables para la estructura del modal */
.rcm-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(15, 23, 42, 0.6); /* Backdrop semi-transparente slate */
    backdrop-filter: blur(4px); /* Difuminado premium */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.rcm-dialog {
    background-color: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    width: 90%;
    max-width: 480px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: rcm-slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes rcm-slide-up {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.rcm-header {
    padding: 20px 24px;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.rcm-title {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    color: #0f172a;
}

.rcm-close {
    background: none;
    border: none;
    font-size: 1.1rem;
    color: #64748b;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: background-color 0.2s, color 0.2s;
}

.rcm-close:hover:not(:disabled) {
    background-color: #f1f5f9;
    color: #0f172a;
}

.rcm-close:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.rcm-body {
    padding: 24px;
}

.rcm-warning {
    background-color: #fffbeb;
    border-left: 4px solid #f59e0b;
    padding: 16px;
    border-radius: 4px;
    display: flex;
    gap: 12px;
}

.rcm-warning-icon {
    color: #d97706;
    font-size: 1.1rem;
    margin-top: 2px;
}

.rcm-warning-text {
    margin: 0;
    font-size: 0.825rem;
    color: #78350f;
    line-height: 1.4;
}

.rcm-error-banner {
    background-color: #fef2f2;
    border-left: 4px solid #ef4444;
    padding: 12px 16px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #991b1b;
    font-size: 0.85rem;
}

.rcm-footer {
    padding: 16px 24px;
    background-color: #f8fafc;
    border-top: 1px solid #f1f5f9;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
}

.rcm-btn {
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
    border: none;
}

.rcm-btn--secondary {
    background-color: #e2e8f0;
    color: #334155;
}

.rcm-btn--secondary:hover:not(:disabled) {
    background-color: #cbd5e1;
}

.rcm-btn--primary {
    background-color: #6d28d9; /* Morado corporativo */
    color: #ffffff;
}

.rcm-btn--primary:hover:not(:disabled) {
    background-color: #5b21b6;
}

.rcm-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
</style>

<script type="text/x-template" id="tpl-consolidated-report-modal">
<div v-if="visible" class="rcm-backdrop" @click.self="onBackdropClick">
    <div class="rcm-dialog" role="dialog" aria-modal="true" aria-labelledby="rcm-report-title">
        <div class="rcm-header">
            <h3 id="rcm-report-title" class="rcm-title" style="color: #6d28d9; font-weight: 700;">Reporte Consolidado (Excel)</h3>
            <button type="button" class="rcm-close" aria-label="Cerrar" :disabled="loading" @click="close">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="rcm-body">
            <!-- Loader con progreso simulado (estado loading) - Perfectamente centrado verticalmente en el modal -->
            <div v-if="loading" class="d-flex flex-column align-items-center justify-content-center text-center w-100" style="min-height: 200px;" role="status" aria-live="polite">
                <div class="spinner-border mb-3" style="width: 3.5rem; height: 3.5rem; color: #6d28d9 !important;" role="status">
                    <span class="sr-only">Cargando...</span>
                </div>
                <div>
                    <h5 class="font-weight-bold text-dark mb-1" style="font-size: 1.05rem;">${ progressMessage }</h5>
                    <p class="text-muted small px-3 mb-0">Generando reporte consolidado de casos. Por favor, no cierres este modal.</p>
                </div>
            </div>

            <!-- Formulario de Selección (estados idle / error) -->
            <div v-else class="d-flex flex-column" style="gap: 16px;">
                <!-- Grid horizontal de 2 columnas usando clases estándar de Bootstrap -->
                <div class="row">
                    <div class="col-6">
                        <div class="form-group mb-0">
                            <label class="font-weight-bold text-secondary mb-1" style="font-size: 0.85rem;" for="rcm-date-from">Fecha de creación Desde:</label>
                            <input
                                type="date"
                                id="rcm-date-from"
                                class="form-control"
                                v-model="startDate"
                                :disabled="loading"
                                style="border-radius: 8px; border: 1px solid #cbd5e1; height: 42px; display: block; width: 100%; box-sizing: border-box;"
                            />
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group mb-0">
                            <label class="font-weight-bold text-secondary mb-1" style="font-size: 0.85rem;" for="rcm-date-to">Fecha de creación Hasta:</label>
                            <input
                                type="date"
                                id="rcm-date-to"
                                class="form-control"
                                v-model="endDate"
                                :disabled="loading"
                                style="border-radius: 8px; border: 1px solid #cbd5e1; height: 42px; display: block; width: 100%; box-sizing: border-box;"
                            />
                        </div>
                    </div>
                </div>

                <!-- Error Banner -->
                <div v-if="errorMessage" class="rcm-error-banner" role="alert">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>${ errorMessage }</span>
                </div>

                <!-- Advertencia visual -->
                <div class="rcm-warning">
                    <div class="rcm-warning-icon" aria-hidden="true">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <p class="rcm-warning-text">
                        <strong>Nota:</strong> Para rangos de fecha amplios, la generación del reporte consolidado puede tomar hasta 20 segundos debido al volumen de datos. El formato largo de la hoja "Respuestas de formulario" está limitado a un máximo de 1 millón de celdas por Excel.
                    </p>
                </div>
            </div>
        </div>

        <div class="rcm-footer">
            <button type="button" class="rcm-btn rcm-btn--secondary" :disabled="loading" @click="close">
                Cancelar
            </button>
            <button
                type="button"
                class="rcm-btn rcm-btn--primary"
                :disabled="loading || !startDate || !endDate"
                @click="submitReport"
                aria-busy="loading"
                style="background-color: #6d28d9; border-color: #6d28d9;"
            >
                ${ loading ? 'Procesando...' : 'Descargar' }
            </button>
        </div>
    </div>
</div>
</script>
{{ end }}
