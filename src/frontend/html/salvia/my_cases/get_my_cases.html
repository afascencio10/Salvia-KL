<main class="salvia-main">
<div class="container">
    <div class="welcome-section">
        <div>
            <h2><b>Mis casos</b></h2>
            <p class="text-muted mb-0">Casos asignados a ${ currentUser }</p>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <a href="/salvia/casos/nuevo"><button class="btn btn-primary">Crear Nuevo caso <i class="fas fa-plus-circle"></i></button></a>
        </div>
    </div>

    {{ template "salvia/case_component/case_component.html" . }}

    <div v-if="roleLoadError" class="mc-error-state">
        <i class="fas fa-exclamation-triangle"></i>
        <span>${ roleLoadError }</span>
    </div>

    <div v-else class="mt-4 mb-4">
        <casos-component
            :agent-id="currentUserId"
            :default-filter="casosDefaultFilter"
            :available-filters="casosAvailableFilters"
            :columns="casosColumns"
            :buttons="casosButtons"
            @action-clicked="onCasoActionClicked"
        ></casos-component>
    </div>
</div>
</main>

{{ template "standard_scripts.html" . }}
{{ template "overlay.html" . }}

<script>
    var home = Vue.createApp({
        delimiters: ['${', '}'],
        data: function() {
            return {
                windowTitle: {{.windowTitle}},
                currentUser: "{{.currentUser}}",
                currentRole: "{{.currentRole}}",
                currentUserId: "{{.currentUserId}}",
                menu: {{.menu}},
                roleLoadError: null,

                //casosDefaultFilter: { key: 'persona_asignada', value: "{{.currentUserId}}" },
                casosDefaultFilter: {},
                casosAvailableFilters: [
                    { key: 'casos_nuevos', type: 'chip',     label: 'Casos nuevos', options: [] },
                    { key: 'riesgo',       type: 'dropdown', label: 'Nivel de riesgo', options: [
                        { value: 'bajo',     label: 'Bajo'     },
                        { value: 'moderado', label: 'Moderado' },
                        { value: 'alto',     label: 'Alto'     },
                        { value: 'extremo',  label: 'Extremo'  },
                    ]},
                    { key: 'estado_caso', type: 'dropdown', label: 'Estado del caso', options: [
                        { value: 'ra', label: 'Activo' },
                        { value: 'is', label: 'Con novedad' },
                        { value: 'cd', label: 'Cerrado' },
                        { value: 'ex', label: 'Vencido' },
                        { value: 'r',  label: 'Por aprobar' },
                        { value: 'fc', label: 'Recontacto' },
                    ]},
                    { key: 'seguimientos_ejecutados', type: 'dropdown', label: 'Seguimientos ejecutados', options: (function() {
                        var opts = [];
                        for (var i = 0; i <= 10; i++) {
                            opts.push({ value: String(i), label: String(i) });
                        }
                        return opts;
                    })() },
                    { key: 'busqueda',     type: 'search',   label: 'Buscar por documento o teléfono' },
                    { key: 'barreras_activas', type: 'dropdown', label: 'Barreras', options: [
                        { value: 'OPEN', label: 'Abierta' },
                    ]},
                ],
                casosColumns: [
                    { key: 'victim_info',         label: 'Víctima'             },
                    { key: 'case_status',         label: 'Estado del caso'     },
                    { key: 'registration_date',   label: 'Fecha de registro'   },
                    { key: 'risk_level',          label: 'Nivel de riesgo'     },
                    { key: 'team',                label: 'Equipo'              },
                    { key: 'next_follow_up_date', label: 'Próximo seguimiento' },
                    { key: 'completed_follow_ups', label: 'Seguimientos ejecutados' },
                    { key: 'barriers',             label: 'Barreras'              },
                ],
                casosButtons: [
                    {
                        id: 'detalle',
                        label: 'Detalle del caso',
                        icon: 'fas fa-layer-group',
                        variant: 'primary',
                        title: 'Ver detalle completo',
                        href: '/salvia/casos/{i_code}/detalle',
                    },
                    {
                        id: 'consultar',
                        label: 'Consultar caso',
                        icon: 'fas fa-eye',
                        title: 'Consultar caso',
                        href: '/salvia/casos/{i_code}/',
                    },

                ],
            };
        },
        mounted: function() {
            document.title = {{.windowTitle}};
            var validRoles = ['op', 'ro'];
            if (validRoles.indexOf(this.currentRole) === -1) {
                this.roleLoadError = 'Rol no autorizado para acceder a esta pantalla.';
            }
            document.getElementById('app').style.display = 'block';
        },
        methods: {
            onCasoActionClicked: function(payload) {
                var code = payload.case && (payload.case.i_code || payload.case.id);
                if (!code) {
                    return;
                }
                if (payload.buttonId === 'consultar') {
                    location.assign('/salvia/casos/' + code + '/');
                } else if (payload.buttonId === 'detalle') {
                    location.assign('/salvia/casos/' + code + '/detalle');
                }
            },
            logout(){
                logout("/seguridad/logout");
            },
        },
    });

    var app = home;

    var _tplCasos = document.getElementById('tpl-casos-component');
    window.__casosComponentTpl = _tplCasos ? _tplCasos.innerHTML : '';
</script>

<script src="/static/js/components/casos-component.js"></script>

<script>
    home.mount("#app");
</script>
