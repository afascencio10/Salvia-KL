{{/* Template: barrieris.html — Pantalla de Mis Barreras */}}
<link rel="stylesheet" href="/static/css/barriers.css">

<div class="container mb-container">

    <!-- ─── Encabezado ─── -->
    <div class="mb-header">
        <h2><b>Mis Barreras</b></h2>
        <p class="mb-header-subtitle">Barreras asignadas al enlace territorial</p>
    </div>

    <!-- ─── Estado de carga ─── -->
    <div v-if="isLoading" class="mb-loading-state">
        <div class="mb-spinner"></div>
        <span>Cargando barreras...</span>
    </div>

    <!-- ─── Toast de éxito ─── -->
    <div v-if="successToast" class="mb-success-toast">
        <i class="fas fa-circle-check"></i>
        ${ successToast }
    </div>

    <!-- ─── Error: rol no autorizado o fallo de red ─── -->
    <div v-if="loadError && !isLoading" class="mb-error-state">
        <i class="fas fa-exclamation-triangle"></i>
        ${ loadError }
    </div>

    <template v-if="!isLoading && !loadError">

        <!-- ─── Tabs ─── -->
        <div class="mb-tabs-wrapper">
            <button class="mb-tab" :class="{ active: currentTab === 'por_articular' }" @click="switchTab('por_articular')">
                Por Articular
                <span class="mb-tab-badge">${ porArticularCount }</span>
            </button>
            <button class="mb-tab" :class="{ active: currentTab === 'articuladas' }" @click="switchTab('articuladas')">
                Articuladas
                <span class="mb-tab-badge">${ articuladasCount }</span>
            </button>
        </div>

        <!-- ─── Filtros ─── -->
        <div class="mb-filters">
            <div class="mb-filter-group">
                <label>Número de identidad</label>
                <input v-model="filters.identidad" type="text" class="mb-filter-input form-control" placeholder="Ej: 52.123.456">
            </div>
            <div class="mb-filter-group">
                <label>Entidad</label>
                <input v-model="filters.entidad" type="text" class="mb-filter-input form-control" placeholder="Ej: Fiscalía">
            </div>
        </div>

        <!-- ─── Tabla de barreras ─── -->
        <div class="mb-table-wrapper">

            <div class="mb-table-header" :class="currentTab === 'articuladas' ? 'mb-grid-4' : 'mb-grid-5'">
                <div>Caso</div>
                <div>Barrera</div>
                <div>Tarea (solicitud)</div>
                <div>Gestión Realizada</div>
                <div v-if="currentTab !== 'articuladas'">Acción</div>
            </div>

            <template v-if="paginatedBarreras.length > 0">
                <div
                    v-for="barrera in paginatedBarreras"
                    :key="barrera.id"
                    class="mb-row"
                    :class="currentTab === 'articuladas' ? 'mb-grid-4' : 'mb-grid-5'">

                    <!-- CASO -->
                    <div>
                        <div class="mb-caso-name">${ barrera.victimName }</div>
                        <div class="mb-caso-code">${ barrera.caseCode } · ${ barrera.docNumber }</div>
                        <span class="mb-prioridad-tag" :class="'mb-prioridad-' + slugify(barrera.priority)">${ barrera.priority }</span>
                        <br>
                        <a :href="'/salvia/casos/' + barrera.caseId + '/detalle'" class="mb-link">Ver caso →</a>
                    </div>

                    <!-- BARRERA -->
                    <div>
                        <div class="mb-sectors-row">
                            <span class="mb-sector-tag" :class="'mb-sector-' + slugify(barrera.sector)">${ barrera.sector }</span>
                        </div>
                        <div class="mb-barrera-desc">${ barrera.description }</div>
                        <a :href="'/salvia/barreras/' + barrera.barrierId" class="mb-link">Ver barrera →</a>
                    </div>

                    <!-- TAREA (SOLICITUD) -->
                    <div>
                        <div class="mb-org-tag">${ barrera.taskTypeLabel }</div>
                        <div class="mb-barrera-desc">${ barrera.taskDescription }</div>
                    </div>

                    <!-- GESTIÓN REALIZADA -->
                    <div>
                        <p v-if="barrera.gestion" class="mb-gestion-text">${ barrera.gestion }</p>
                    </div>

                    <!-- ACCIÓN (solo en tab Por Articular) -->
                    <div v-if="currentTab !== 'articuladas'" class="mb-accion-cell">
                        <button
                            v-if="barrera.canManage"
                            @click="openGestionar(barrera)"
                            class="btn mb-btn-gestionar">
                            Gestionar
                        </button>
                    </div>

                </div>
            </template>

            <div v-else class="mb-empty-state">
                <i class="fas fa-inbox"></i>
                No se encontraron barreras con los filtros seleccionados.
            </div>

        </div>

        <!-- ─── Paginador ─── -->
        <nav v-if="numPages > 1" aria-label="Paginación" class="mb-pagination-wrapper">
            <ul class="pagination justify-content-center mt-3">
                <li class="page-item" :class="{ disabled: currentPage === 0 }">
                    <a class="page-link" href="#" @click.prevent="goToPage(currentPage - 1)">Anterior</a>
                </li>
                <template v-for="(p, i) in visiblePages" :key="i">
                    <li v-if="p === '...'" class="page-item disabled">
                        <span class="page-link">...</span>
                    </li>
                    <li v-else class="page-item" :class="{ active: p === currentPage }">
                        <a class="page-link" href="#" @click.prevent="goToPage(p)">${ p + 1 }</a>
                    </li>
                </template>
                <li class="page-item" :class="{ disabled: currentPage === numPages - 1 }">
                    <a class="page-link" href="#" @click.prevent="goToPage(currentPage + 1)">Siguiente</a>
                </li>
            </ul>
        </nav>

    </template>

</div>

{{ template "barriers/modal_gestionar.html" . }}

{{ template "standard_scripts.html" .}}
{{ template "overlay.html" .}}

<script>
    /* Variables renderizadas por el servidor — consumidas por barriers.js */
    window.__MisBarrerasConfig = {
        currentUser:   {{.currentUser}},
        currentRole:   {{.currentRole}},
        currentUserId: {{.currentUserId}}
    };
</script>
<script src="/static/js/components/barriers.js"></script>
