{{/* Template: barreras_departamento.html — Pantalla de Barreras Departamento */}}
<link rel="stylesheet" href="/static/css/barriers.css">

<div class="container mb-container">

    <!-- ─── Encabezado ─── -->
    <div class="mb-header">
        <h2><b>Barreras Departamento</b></h2>
        <p class="mb-header-subtitle">Historial de barreras activas de los casos del departamento</p>
    </div>

    <!-- ─── Estado de carga ─── -->
    <div v-if="isLoading" class="mb-loading-state">
        <div class="mb-spinner"></div>
        <span>Cargando barreras...</span>
    </div>

    <!-- ─── Error: rol no autorizado o fallo de red ─── -->
    <div v-if="loadError && !isLoading" class="mb-error-state">
        <i class="fas fa-exclamation-triangle"></i>
        ${ loadError }
    </div>

    <template v-if="!isLoading && !loadError">

        <!-- ─── Filtros ─── -->
        <div class="mb-filters mb-filters-3">
            <div class="mb-filter-group">
                <label>Número de identidad</label>
                <input v-model="filters.identidad" type="text" class="mb-filter-input form-control" placeholder="Ej: 52.123.456">
            </div>
            <div class="mb-filter-group">
                <label>Entidad</label>
                <input v-model="filters.entidad" type="text" class="mb-filter-input form-control" placeholder="Ej: Fiscalía">
            </div>
            <div class="mb-filter-group">
                <label>Ciudad</label>
                <input v-model="filters.ciudad" type="text" class="mb-filter-input form-control" placeholder="Ej: Bogotá">
            </div>
        </div>

        <!-- ─── Tabla de barreras ─── -->
        <div class="mb-table-wrapper">

            <div class="mb-table-header mb-grid-dept">
                <div>Caso</div>
                <div>Tipología</div>
                <div>Entidad</div>
                <div>Estado</div>
                <div>Descripción</div>
                <div>Fecha identificación</div>
            </div>

            <template v-if="paginatedBarreras.length > 0">
                <div
                    v-for="barrera in paginatedBarreras"
                    :key="barrera.id"
                    class="mb-row mb-grid-dept">

                    <!-- CASO -->
                    <div>
                        <div class="mb-caso-name">${ barrera.victimName }</div>
                        <div class="mb-caso-code">${ barrera.caseCode } · ${ barrera.docNumber }</div>
                        <span class="mb-prioridad-tag" :class="'mb-prioridad-' + slugify(barrera.priority)">${ barrera.priority }</span>
                        <br>
                        <a :href="'/salvia/casos/' + barrera.caseId + '/detalle'" class="mb-link">Ver caso →</a>
                    </div>

                    <!-- TIPOLOGÍA -->
                    <div>
                        <span class="mb-sector-tag" :class="'mb-sector-' + slugify(barrera.sector)">${ barrera.sector }</span>
                    </div>

                    <!-- ENTIDAD -->
                    <div>${ barrera.entityBranchName }</div>

                    <!-- ESTADO -->
                    <div>
                        <span class="mb-estado-tag" :class="'mb-estado-' + slugify(barrera.estadoLabel)">${ barrera.estadoLabel }</span>
                    </div>

                    <!-- DESCRIPCIÓN -->
                    <div class="mb-barrera-desc">${ barrera.description }</div>

                    <!-- FECHA IDENTIFICACIÓN -->
                    <div>
                        ${ barrera.fechaIdentificacion }
                        <br>
                        <a :href="'/salvia/barreras/' + barrera.id" class="mb-link">Ver barrera →</a>
                    </div>

                </div>
            </template>

            <div v-else class="mb-empty-state">
                <i class="fas fa-inbox"></i>
                No se encontraron barreras con los filtros seleccionados.
            </div>

        </div>

        <!-- ─── Paginador ─── -->
        <nav v-if="numPages > 1" aria-label="Paginación" class="mb-pagination-wrapper">
            <ul class="pagination justify-content-center mt-3">
                <li class="page-item" :class="{ disabled: currentPage === 0 }">
                    <a class="page-link" href="#" @click.prevent="goToPage(currentPage - 1)">Anterior</a>
                </li>
                <template v-for="(p, i) in visiblePages" :key="i">
                    <li v-if="p === '...'" class="page-item disabled">
                        <span class="page-link">...</span>
                    </li>
                    <li v-else class="page-item" :class="{ active: p === currentPage }">
                        <a class="page-link" href="#" @click.prevent="goToPage(p)">${ p + 1 }</a>
                    </li>
                </template>
                <li class="page-item" :class="{ disabled: currentPage === numPages - 1 }">
                    <a class="page-link" href="#" @click.prevent="goToPage(currentPage + 1)">Siguiente</a>
                </li>
            </ul>
        </nav>

    </template>

</div>

{{ template "standard_scripts.html" .}}
{{ template "overlay.html" .}}

<script>
    /* Variables renderizadas por el servidor — consumidas por barreras_departamento.js */
    window.__BarrerasDepartamentoConfig = {
        currentUser:   {{.currentUser}},
        currentRole:   {{.currentRole}},
        currentUserId: {{.currentUserId}}
    };
</script>
<script src="/static/js/components/barreras_departamento.js"></script>
