{{ define "salvia/case_component/case_component.html" }}
{{/* Partial: case_component.html — Componente reutilizable de tabla de casos */}}
<link rel="stylesheet" href="/static/css/casos-component.css">

<!-- ─── Template Vue del componente casos-component ─── -->
<script type="text/x-template" id="tpl-casos-component">
<div class="cc-wrapper">

    <!-- ── FILTER BAR (siempre visible) ── -->
    <div class="cc-filter-bar">

            <!-- Grupo de filtros dinámicos -->
            <div class="cc-filter-group">
                <template v-for="filter in filtersForBar" :key="filter.key">

                    <!-- Chip -->
                    <template v-if="filter.type === 'chip'">
                        <button
                            class="cc-chip"
                            :class="{
                                'cc-chip--active': activeChipKey === filter.key,
                                'cc-chip--has-tooltip': !!chipTooltipText(filter)
                            }"
                            :data-cc-tooltip="chipTooltipText(filter)"
                            :aria-label="chipTooltipText(filter) || filter.label"
                            @click="toggleChipFilter(filter.key)"
                        >
                            ${ filter.label }
                        </button>
                    </template>

                    <!-- Dropdown -->
                    <template v-else-if="filter.type === 'dropdown'">
                        <div class="cc-filter-dropdown">
                            <label class="cc-filter-label">${ filter.label }</label>
                            <select
                                class="cc-select"
                                :class="{ 'cc-select--active': !!activeDropdowns[filter.key] }"
                                :value="dropdownSelectValue(filter.key)"
                                @change="setDropdownFilter(filter.key, $event.target.value)"
                            >
                                <option value="">Todos / Todas</option>
                                <option
                                    v-for="opt in filter.options"
                                    :key="opt.value"
                                    :value="opt.value"
                                >
                                    ${ opt.label }
                                </option>
                            </select>
                        </div>
                    </template>

                    <!-- Autocomplete -->
                    <template v-else-if="filter.type === 'autocomplete'">
                        <div class="cc-autocomplete-filter" :data-autocomplete-key="filter.key">
                            <label class="cc-filter-label">${ filter.label }</label>

                            <!-- Estado: escribiendo -->
                            <div v-if="!autocompleteSelected[filter.key]" class="cc-autocomplete-input-wrap">
                                <input
                                    type="text"
                                    class="cc-autocomplete-input"
                                    :class="{ 'cc-autocomplete-input--error': autocompleteError[filter.key] }"
                                    :placeholder="filter.label"
                                    v-model="autocompleteText[filter.key]"
                                    @input="onAutocompleteInput(filter.key)"
                                    autocomplete="off"
                                />
                                <div v-if="autocompleteLoading[filter.key]" class="cc-autocomplete-spinner"></div>
                            </div>

                            <!-- Estado: opción seleccionada -->
                            <div v-else class="cc-autocomplete-tag">
                                <span class="cc-tag-label">${ autocompleteSelected[filter.key].label }</span>
                                <button class="cc-tag-clear" @click="clearAutocomplete(filter.key)" type="button">✕</button>
                            </div>

                            <!-- Dropdown flotante de sugerencias -->
                            <div
                                v-if="autocompleteShowDropdown(filter.key)"
                                class="cc-autocomplete-dropdown"
                                :class="{ 'cc-dropdown--loading': autocompleteLoading[filter.key] }"
                            >
                                <div
                                    v-for="opt in autocompleteSuggestions[filter.key]"
                                    :key="opt.value"
                                    class="cc-autocomplete-item"
                                    @click="selectAutocompleteSuggestion(filter.key, opt)"
                                >
                                    ${ opt.label }
                                </div>
                                <div
                                    v-if="autocompleteShowNoResults(filter.key)"
                                    class="cc-autocomplete-empty"
                                >
                                    Sin resultados
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Search -->
                    <template v-else-if="filter.type === 'search'">
                        <div class="cc-search-filter">
                            <label class="cc-filter-label">${ filter.label }</label>
                            <input
                                type="text"
                                class="cc-search-input"
                                :placeholder="filter.label"
                                v-model="searchText"
                                @input="onSearchInput()"
                                autocomplete="off"
                            />
                        </div>
                    </template>

                </template>
            </div>
            <!-- /filter-group -->

            <!-- Sort selector -->
            <div class="cc-sort-selector">
                <label class="cc-filter-label">Ordenar por</label>
                <select class="cc-select cc-select--active" :value="sortOption" @change="onSortChange($event)">
                    <option value="registration_date_desc">Fecha de registro DESC</option>
                    <option value="registration_date_asc">Fecha de registro ASC</option>
                    <option value="next_follow_up_desc">Próximo seguimiento DESC</option>
                    <option value="next_follow_up_asc">Próximo seguimiento ASC</option>
                </select>
            </div>

        </div>
        <!-- /FILTER BAR -->

        <!-- ── TABLE WRAP ── -->
        <div class="cc-table-wrap">

            <!-- Loading solo sobre la tabla -->
            <div v-if="loading" class="cc-table-loading">
                <div class="cc-loading-spinner"></div>
                <span>Cargando casos...</span>
            </div>

            <!-- Error solo en el área de la tabla -->
            <div v-else-if="loadError" class="cc-error">
                <i class="fas fa-exclamation-triangle"></i>
                <span>${ loadError }</span>
            </div>

            <template v-else>

            <!-- Alerta informativa sobre la tabla (E-14) -->
            <div
                v-if="tableAlert.visible"
                class="cc-table-alert-overlay"
                role="alert"
                aria-live="polite"
            >
                <div class="cc-table-alert">
                    <div class="cc-table-alert-icon" aria-hidden="true">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="cc-table-alert-body">
                        <span class="cc-table-alert-title">Selección no permitida</span>
                        <p class="cc-table-alert-message">${ tableAlert.message }</p>
                    </div>
                    <button
                        type="button"
                        class="cc-table-alert-close"
                        aria-label="Cerrar alerta"
                        @click="hideTableAlert"
                    >
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Toolbar reasignación (E-14 / E-15) -->
            <div v-if="reasignacion && selectedCases.length > 0" class="cc-table-toolbar">
                <span class="cc-selection-count">${ selectedCases.length } caso(s) seleccionado(s)</span>
                <button
                    class="cc-reassign-btn"
                    type="button"
                    @click="emitReasignarCasos"
                >
                    Reasignar Casos
                </button>
            </div>

            <!-- Estado vacío -->
            <div v-if="filteredCases.length === 0" class="cc-empty">
                <i class="fas fa-inbox"></i>
                <span>No se encontraron casos</span>
            </div>

            <!-- Tabla + paginación -->
            <template v-else>
                <div class="cc-table-scroll-group">
                <div
                    class="cc-table-scroll cc-table-scroll-top"
                    ref="tableScrollTop"
                    @scroll="onTableScrollTop"
                    aria-hidden="true"
                >
                    <div class="cc-table-scroll-spacer" ref="tableScrollTopInner"></div>
                </div>
                <div
                    class="cc-table-scroll cc-table-scroll-main"
                    ref="tableScrollMain"
                    @scroll="onTableScrollMain"
                >
                <table class="cc-table">
                    <thead>
                        <tr>
                            <th v-if="reasignacion" class="cc-th cc-th-select">
                                <label class="cc-select-all-label">
                                    <input
                                        type="checkbox"
                                        class="cc-case-checkbox cc-select-all-checkbox"
                                        :checked="isAllCurrentPageSelected"
                                        :indeterminate.prop="isSomeCurrentPageSelected"
                                        aria-label="Seleccionar todos los casos de la página"
                                        @change="toggleSelectAllCurrentPage($event)"
                                    />
                                    <span class="cc-select-all-text"></span>
                                </label>
                            </th>
                            <th
                                v-for="col in visibleColumns"
                                :key="col.key"
                                class="cc-th"
                            >
                                ${ col.label }
                            </th>
                            <th v-if="buttons.length > 0" class="cc-th">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr
                            v-for="caseObj in filteredCases"
                            :key="caseObj.id"
                            class="cc-row"
                        >
                            <td v-if="reasignacion" class="cc-cell-select">
                                <input
                                    type="checkbox"
                                    class="cc-case-checkbox"
                                    :checked="isCaseSelected(caseObj)"
                                    :aria-label="'Seleccionar caso ' + (caseObj.i_code || caseObj.id)"
                                    @change="toggleCaseSelection(caseObj, $event)"
                                />
                            </td>

                            <template v-for="col in visibleColumns" :key="col.key">

                                <!-- victim_info -->
                                <td v-if="col.key === 'victim_info'" class="cc-cell-victim">
                                    <div class="cc-victim-name">${ caseObj.names } ${ caseObj.lastNames }</div>
                                    <div class="cc-victim-meta">
                                        <span>Doc: ${ caseObj.docNumber || '—' }</span>
                                        <span class="cc-victim-meta-sep">·</span>
                                        <span>Tel: ${ caseObj.victimPhone || '—' }</span>
                                    </div>
                                </td>

                                <!-- operator -->
                                <td v-else-if="col.key === 'operator'" class="cc-cell">
                                    ${ ownerFullName(caseObj) }
                                </td>

                                <!-- registration_date -->
                                <td v-else-if="col.key === 'registration_date'" class="cc-cell">
                                    ${ formatDateUTC(caseObj.creationDate) }
                                </td>

                                <!-- risk_level -->
                                <td v-else-if="col.key === 'risk_level'" class="cc-cell">
                                    <span :class="riskBadgeClass(caseObj.riskStatus)">${ riskBadgeLabel(caseObj.riskStatus) }</span>
                                </td>

                                <!-- team -->
                                <td v-else-if="col.key === 'team'" class="cc-cell">
                                    ${ caseObj.caseTeam || '—' }
                                </td>

                                <!-- assigned_person -->
                                <td v-else-if="col.key === 'assigned_person'" class="cc-cell">
                                    ${ ownerFullName(caseObj) }
                                </td>

                                <!-- next_follow_up_date -->
                                <td v-else-if="col.key === 'next_follow_up_date'" class="cc-cell-follow-up">
                                    <span v-if="caseObj.nextFollowUpDate" class="cc-follow-up-date">
                                        ${ formatDate(caseObj.nextFollowUpDate) }
                                    </span>
                                    <span v-else class="cc-follow-up-none">—</span>
                                </td>

                                <!-- completed_follow_ups -->
                                <td v-else-if="col.key === 'completed_follow_ups'" class="cc-cell cc-cell-completed-follow-ups">
                                    ${ completedFollowUpsDisplay(caseObj) }
                                </td>

                                <!-- case_status -->
                                <td v-else-if="col.key === 'case_status'" class="cc-cell">
                                    <span :class="caseStatusBadgeClass(caseObj.status)">${ caseStatusLabel(caseObj.status) }</span>
                                </td>

                                <!-- barriers -->
                                <td v-else-if="col.key === 'barriers'" class="cc-cell cc-cell-barriers">
                                    <span v-if="formatOpenBarriers(caseObj)" class="cc-barriers-text">
                                        ${ formatOpenBarriers(caseObj) }
                                    </span>
                                </td>

                                <!-- columna desconocida -->
                                <td v-else class="cc-cell">—</td>

                            </template>

                            <!-- Columna de acciones -->
                            <td v-if="buttons.length > 0" class="cc-cell-actions">
                                <template v-for="btn in buttons" :key="btn.id">
                                    <a
                                        v-if="getActionHref(btn, caseObj)"
                                        :href="getActionHref(btn, caseObj)"
                                        :class="actionButtonClass(btn)"
                                        :title="btn.title || btn.label"
                                    >
                                        <i v-if="btn.icon" :class="btn.icon" aria-hidden="true"></i>
                                        ${ btn.label }
                                    </a>
                                    <button
                                        v-else
                                        :class="actionButtonClass(btn)"
                                        type="button"
                                        :title="btn.title || btn.label"
                                        @click="emitActionClicked(btn.id, caseObj)"
                                    >
                                        <i v-if="btn.icon" :class="btn.icon" aria-hidden="true"></i>
                                        ${ btn.label }
                                    </button>
                                </template>
                            </td>

                        </tr>
                    </tbody>
                </table>
                </div>
                </div>

                <!-- Paginación -->
                <div class="cc-pagination">
                    <button
                        class="cc-page-btn"
                        type="button"
                        :disabled="currentPage === 1"
                        @click="changePage(currentPage - 1)"
                    >
                        ← Anterior
                    </button>
                    <div class="cc-pagination-meta">
                        <span class="cc-page-info">Página ${ currentPage } de ${ totalPages }</span>
                        <span class="cc-total-records">Total de registros: ${ totalCasesFormatted }</span>
                    </div>
                    <button
                        class="cc-page-btn"
                        type="button"
                        :disabled="currentPage === totalPages"
                        @click="changePage(currentPage + 1)"
                    >
                        Siguiente →
                    </button>
                </div>

            </template>
            <!-- /tabla -->

        </div>
        <!-- /TABLE WRAP -->

</div>
</script>
{{ end }}
