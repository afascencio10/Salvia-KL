{{/* Template: remision_detalle.html — Pantalla de Detalle de Remisión Psicosocial */}}
<link rel="stylesheet" href="/static/css/barrera_detalle.css">

<div class="container brd-container">

    <!-- Loading -->
    <div v-if="cargando" style="text-align:center;padding:80px 0;color:#6b7280">
        <i class="fa fa-spinner fa-spin" style="font-size:1.5rem"></i>
        <p style="margin-top:12px">Cargando información de la remisión...</p>
    </div>

    <!-- Error -->
    <div v-if="error && !cargando" style="text-align:center;padding:80px 20px">
        <div style="max-width:400px;margin:0 auto;background:#fff;border-radius:12px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.08)">
            <p style="font-size:2.5rem;margin:0 0 12px">⚠️</p>
            <p style="font-size:1rem;font-weight:700;color:#111827;margin:0 0 8px">No se pudo cargar la remisión</p>
            <p style="font-size:.85rem;color:#6b7280;margin:0 0 20px">${ error }</p>
            <a href="javascript:history.back()" class="btn btn-secondary" style="border-radius:8px;padding:8px 16px;font-size:.85rem">← Volver</a>
        </div>
    </div>

    <template v-if="remision && !cargando">

        <!-- Breadcrumb -->
        <div class="brd-breadcrumb">
            <a href="javascript:history.back()" class="brd-back-link">
                <i class="fas fa-arrow-left"></i>
                Remisiones
            </a>
            <span class="brd-breadcrumb-sep">/</span>
            <span style="font-size:.82rem;color:#6b7280">${ remision.victimNames } ${ remision.victimLastNames }</span>
        </div>

        <!-- Header -->
        <div class="brd-header-card">
            <div class="brd-victim-avatar">${ remision.victimNames ? remision.victimNames.charAt(0).toUpperCase() : '?' }</div>
            <div class="brd-victim-info" style="flex:1">
                <div class="brd-victim-name-row">
                    <span class="brd-victim-name">${ remision.victimNames } ${ remision.victimLastNames }</span>
                    <span :style="badgeRiesgoStyle(remision.riskLevel)" style="font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px">
                        ${ labelRiesgo(remision.riskLevel) }
                    </span>
                    <span :style="badgeEstadoStyle(remision.status)" style="font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px">
                        ${ labelEstado(remision.status) }
                    </span>
                </div>
                <div class="brd-victim-meta">
                    <span v-if="remision.docNumber">${ remision.docNumber }</span>
                    <span v-if="remision.victimPhone"> · ${ remision.victimPhone }</span>
                    <span v-if="remision.municipality"> · ${ remision.municipality }</span>
                </div>
            </div>
            <div v-if="remision.professionalName" style="display:flex;align-items:center;gap:8px">
                <div style="width:32px;height:32px;border-radius:50%;background:#ede9fe;color:#5106A7;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700">${ remision.professionalName.charAt(0).toUpperCase() }</div>
                <div>
                    <div style="font-size:.78rem;font-weight:600;color:#374151">${ remision.professionalName }</div>
                    <div style="font-size:.68rem;color:#9ca3af">${ remision.professionalRole || 'Profesional' }</div>
                </div>
            </div>
        </div>

        <!-- Sesiones counter -->
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:0 4px">
            <span style="font-size:.78rem;color:#6b7280">Sesiones (${ remision.sessionCount })</span>
            <span v-for="n in remision.sessionCount" :key="n" style="width:10px;height:10px;border-radius:50%;background:#5106A7"></span>
            <span style="font-size:.75rem;color:#9ca3af;margin-left:4px">${ sesionesRealizadas } realizadas</span>
        </div>

        <!-- Tabs -->
        <div class="brd-tabs-wrapper">
            <button class="brd-tab" :class="{ active: activeTab === 'info' }" @click="activeTab = 'info'">
                📋 Info Remisión
            </button>
            <button class="brd-tab" :class="{ active: activeTab === 'contactos' }" @click="activeTab = 'contactos'">
                📞 Contactos
            </button>
            <button class="brd-tab" :class="{ active: activeTab === 'tareas' }" @click="activeTab = 'tareas'">
                ✅ Tareas
            </button>
            <button class="brd-tab" :class="{ active: activeTab === 'timeline' }" @click="activeTab = 'timeline'">
                📊 Timeline
            </button>
        </div>

        <!-- Tab: Info Remisión -->
        <div v-if="activeTab === 'info'" class="brd-tab-content-card">
            <p style="font-size:.9rem;font-weight:700;color:#111827;margin:0 0 16px">Datos de la remisión</p>

            <div class="brd-barrier-detail-row">
                <div class="brd-detail-field">
                    <span class="brd-detail-label">Motivo</span>
                    <span class="brd-detail-value" style="font-weight:600">${ remision.type || '—' }</span>
                </div>
                <div class="brd-detail-field">
                    <span class="brd-detail-label">Fecha de remisión</span>
                    <span class="brd-detail-value" style="font-weight:600">${ remision.createdAt }</span>
                </div>
                <div class="brd-detail-field">
                    <span class="brd-detail-label">Remitido por</span>
                    <span class="brd-detail-value" style="font-weight:600">${ remision.submittedByName || '—' }</span>
                    <span v-if="remision.submittedByTeam" style="font-size:.72rem;color:#9ca3af;display:block">${ remision.submittedByTeam }</span>
                </div>
                <div class="brd-detail-field">
                    <span class="brd-detail-label">Psicóloga asignada</span>
                    <span class="brd-detail-value" style="font-weight:600;color:#5106A7">${ remision.professionalName || 'Sin asignar' }</span>
                </div>
            </div>

            <!-- Observaciones -->
            <div v-if="remision.notes" style="margin-top:16px;background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:14px 16px">
                <p style="font-size:.72rem;font-weight:700;color:#92400e;text-transform:uppercase;margin:0 0 6px">🔒 Observaciones de la remisión (solo equipo psicosocial)</p>
                <p style="font-size:.84rem;color:#374151;margin:0;line-height:1.5">${ remision.notes }</p>
            </div>
        </div>

        <!-- Tab: Contactos -->
        <div v-if="activeTab === 'contactos'" class="brd-tab-content-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <span style="font-size:.82rem;font-weight:700;color:#374151;text-transform:uppercase">Contactos (${ remision.contacts.length })</span>
                <button style="background:#5106A7;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer">+ Registrar contacto</button>
            </div>

            <div v-if="remision.contacts.length === 0" style="text-align:center;padding:40px 0;color:#9ca3af;font-size:.85rem">
                No hay contactos registrados
            </div>

            <div v-for="contact in remision.contacts" :key="contact.id" style="border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px" :style="contact.isCompleted ? 'border-left:3px solid #16a34a' : contact.status === 'agendada' ? 'border-left:3px solid #f59e0b' : 'border-left:3px solid #6b7280'">
                <div style="display:flex;justify-content:space-between;align-items:flex-start">
                    <div>
                        <div style="font-size:.72rem;color:#9ca3af;margin-bottom:4px">
                            ${ contact.scheduledDate || contact.createdAt }
                            <span v-if="contact.scheduledTime"> · ${ contact.scheduledTime }</span>
                        </div>
                        <div style="font-size:.85rem;font-weight:600;color:#111827">
                            <span v-if="contact.isPsicoSession && contact.isCompleted">Sesión realizada</span>
                            <span v-else-if="contact.isPsicoSession && !contact.isCompleted">Sesión agendada</span>
                            <span v-else>Contacto sin sesión</span>
                            <span v-if="contact.sessionType"> — ${ labelSessionType(contact.sessionType) }</span>
                        </div>
                        <div v-if="contact.summary" style="font-size:.8rem;color:#6b7280;margin-top:4px">${ contact.summary }</div>
                    </div>
                    <span style="font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:20px" :style="contact.isCompleted ? 'background:#dcfce7;color:#15803d' : contact.status === 'agendada' ? 'background:#fef3c7;color:#92400e' : 'background:#f3f4f6;color:#6b7280'">
                        ${ contact.isCompleted ? 'Realizada' : contact.status === 'agendada' ? 'Agendada' : 'Contacto' }
                    </span>
                </div>

                <!-- Botones -->
                <div style="display:flex;gap:8px;margin-top:10px">
                    <button v-if="contact.isCompleted" style="font-size:.75rem;padding:5px 12px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;color:#5106A7;cursor:pointer;font-weight:600">Ver sesión</button>
                    <template v-if="!contact.isCompleted && contact.isPsicoSession">
                        <button style="font-size:.75rem;padding:5px 12px;border-radius:6px;border:none;background:#5106A7;color:#fff;cursor:pointer;font-weight:600">Registrar sesión</button>
                        <button style="font-size:.75rem;padding:5px 12px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;font-weight:500">Reprogramar</button>
                        <button style="font-size:.75rem;padding:5px 12px;border-radius:6px;border:1px solid #fecaca;background:#fff;color:#dc2626;cursor:pointer;font-weight:500">Cancelar sesión</button>
                    </template>
                </div>
            </div>
        </div>

        <!-- Tab: Tareas -->
        <div v-if="activeTab === 'tareas'" class="brd-tab-content-card">
            <div style="text-align:center;padding:40px 0;color:#9ca3af;font-size:.85rem">
                <p>No hay tareas asociadas a esta remisión</p>
            </div>
        </div>

        <!-- Tab: Timeline -->
        <div v-if="activeTab === 'timeline'" class="brd-tab-content-card">
            <div style="text-align:center;padding:40px 0;color:#9ca3af;font-size:.85rem">
                <i class="fas fa-history" style="font-size:1.5rem;margin-bottom:8px;display:block"></i>
                <p>No hay eventos en el timeline de esta remisión</p>
            </div>
        </div>

    </template>
</div>

{{ template "standard_scripts.html" .}}
{{ template "overlay.html" .}}

<script>
    var home = Vue.createApp({
        delimiters: ['${', '}'],
        data() {
            return {
                currentUser:   {{.currentUser}},
                currentRole:   {{.currentRole}},
                currentUserId: {{.currentUserId}},
                remisionID:    "{{.remisionId}}",

                activeTab: 'info',
                cargando: true,
                error: null,
                remision: null,
            };
        },

        computed: {
            sesionesRealizadas() {
                if (!this.remision || !this.remision.contacts) return 0;
                return this.remision.contacts.filter(function(c) { return c.isCompleted && c.isPsicoSession; }).length;
            }
        },

        mounted() {
            document.getElementById('app').style.display = 'block';
            this.cargarDetalle();
        },

        methods: {
            async cargarDetalle() {
                this.cargando = true;
                this.error = null;
                try {
                    var res = await fetch('/api/v1/psychosocial-support/' + this.remisionID + '/detail');
                    if (!res.ok) throw new Error('Error ' + res.status);
                    this.remision = await res.json();
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.cargando = false;
                }
            },

            labelRiesgo(level) {
                if (!level) return 'Sin evaluar';
                switch (level) {
                    case 1: return 'Bajo';
                    case 2: return 'Moderado';
                    case 3: return 'Alto';
                    case 4: return 'Extremo';
                    default: return 'Sin evaluar';
                }
            },

            badgeRiesgoStyle(level) {
                switch (level) {
                    case 1: return { background: '#dcfce7', color: '#16a34a', border: '1px solid #86efac' };
                    case 2: return { background: '#dbeafe', color: '#1d4ed8', border: '1px solid #93c5fd' };
                    case 3: return { background: '#ffedd5', color: '#ea580c', border: '1px solid #fdba74' };
                    case 4: return { background: '#fee2e2', color: '#dc2626', border: '1px solid #fca5a5' };
                    default: return { background: '#f3f4f6', color: '#6b7280', border: '1px solid #e5e7eb' };
                }
            },

            labelEstado(status) {
                var map = { 'abierto': 'Abierto', 'en_gestion': 'En proceso', 'en_devolucion': 'En devolución', 'cerrado': 'Cerrado' };
                return map[status] || status;
            },

            badgeEstadoStyle(status) {
                switch (status) {
                    case 'abierto': return { background: '#fff7ed', color: '#c2410c', border: '1px solid #fed7aa' };
                    case 'en_gestion': return { background: '#eff6ff', color: '#1d4ed8', border: '1px solid #bfdbfe' };
                    case 'en_devolucion': return { background: '#fef2f2', color: '#dc2626', border: '1px solid #fecaca' };
                    case 'cerrado': return { background: '#f3f4f6', color: '#6b7280', border: '1px solid #e5e7eb' };
                    default: return { background: '#f3f4f6', color: '#6b7280', border: '1px solid #e5e7eb' };
                }
            },

            labelSessionType(type) {
                var map = { 'PRIMER_CONTACTO': 'Primer contacto', 'PRIMERA_ATENCION': 'Primera atención', 'SEGUIMIENTO': 'Seguimiento', 'CIERRE': 'Cierre' };
                return map[type] || type || '';
            },

            logout() {
                logout('/seguridad/logout');
            }
        }
    });

    var app = home;
</script>
<script>
    home.mount('#app');
</script>
