<div class="container mt-4">
    <div class="welcome-section mb-4">
        <h2><b>Registrar Sesión Psicosocial</b></h2>
    </div>

    <div id="psicosocial-app">

        <!-- ── Loader mientras se resuelve el formulario a cargar ─────────── -->
        <div v-if="pageLoading" class="ps-page-loader">
            <svg class="ps-spinner" width="40" height="40" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="16" fill="none" stroke="#ede9fe" stroke-width="4"></circle>
                <circle cx="20" cy="20" r="16" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 100"></circle>
            </svg>
            <p class="ps-page-loader-text">Cargando sesión psicosocial...</p>
        </div>

        <template v-else>

        <!-- ── Card de información del caso ─────────────────────────────── -->
        <div v-if="victimInfo" class="card ps-card mb-4">
            <div class="card-body">
                <div class="ps-card-header">
                    <div class="ps-card-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="ps-card-name-block">
                        <h5 class="ps-card-name">
                            ${ [victimInfo.Names, victimInfo.LastNames].filter(Boolean).join(' ') || '—' }
                        </h5>
                        <span class="ps-card-location">
                            <i class="fas fa-map-marker-alt"></i> ${ victimInfo.TownName || '—' }
                        </span>
                    </div>
                </div>

                <hr class="ps-divider">

                <div class="ps-card-body-row">
                    <!-- Campos de la víctima -->
                    <div class="ps-card-fields">
                        <div class="ps-field">
                            <span class="ps-field-label">Teléfono</span>
                            <span class="ps-field-value">${ victimInfo.Phone || '—' }</span>
                        </div>
                        <div class="ps-field">
                            <span class="ps-field-label">Identidad de género</span>
                            <span class="ps-field-value">${ victimInfo.GenderIdentity || '—' }</span>
                        </div>
                        <div class="ps-field">
                            <span class="ps-field-label">Nivel de riesgo</span>
                            <span class="ps-field-value ps-risk" :class="'ps-risk--' + victimInfo.RiskLevel">
                                ${ riskLabel }
                            </span>
                        </div>
                        <div class="ps-field">
                            <span class="ps-field-label">Código de caso</span>
                            <span class="ps-field-value">${ victimInfo.CaseICode || '—' }</span>
                        </div>
                    </div>

                    <!-- Estado de la sesión -->
                    <div class="ps-session-status">
                        <div class="ps-ss-badge ps-ss-session">
                            <i class="fas fa-calendar-check"></i>
                            Sesión ${ psicosocialState.sessionCount + 1 } de 6
                        </div>
                        <div class="ps-ss-badge"
                            :style="{ color: statusInfo.color, background: statusInfo.bg, border: '1px solid ' + statusInfo.color + '44' }">
                            ${ statusInfo.label }
                        </div>
                        <div class="ps-ss-badge ps-ss-form">
                            <i class="fas fa-file-alt"></i>
                            ${ formTypeLabel }
                        </div>
                        <div v-if="formState.skipContact" class="ps-ss-badge ps-ss-skip">
                            <i class="fas fa-forward"></i>
                            Continúa desde Primer Contacto
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Error de carga ────────────────────────────────────────────── -->
        <div v-if="loadError" class="alert alert-danger">${ loadError }</div>

        <!-- ── Área principal (modo mock) — preview de secciones simulado ── -->
        <div v-else-if="isMock && sectionsToShow.length > 0" class="ps-layout">

            <!-- Sidebar de navegación de secciones -->
            <aside class="ps-sidebar">
                <div class="ps-sidebar-header">
                    <p class="ps-sidebar-title">SECCIONES</p>
                </div>
                <nav class="ps-sidebar-nav">
                    <button
                        v-for="(sec, idx) in sectionsToShow"
                        :key="idx"
                        class="ps-section-item"
                        :class="{
                            'ps-section-item--active':    currentSectionIdx === idx,
                            'ps-section-item--completed': answeredSections[idx],
                            'ps-section-item--pending':   idx > firstPendingIdx,
                        }"
                        :disabled="idx > firstPendingIdx"
                        @click="goToSection(idx)"
                    >
                        <span class="ps-badge"
                            :class="{
                                'ps-badge--active':    currentSectionIdx === idx,
                                'ps-badge--completed': answeredSections[idx],
                            }">
                            <i v-if="answeredSections[idx]" class="fas fa-check"></i>
                            <span v-else>${ sec.order }</span>
                        </span>
                        <span class="ps-section-name">${ sec.name }</span>
                    </button>
                </nav>

                <!-- Barra de progreso -->
                <div class="ps-progress-wrap">
                    <div class="ps-progress-label">
                        <span>Progreso</span>
                        <span>${ Object.keys(answeredSections).length } / ${ sectionsToShow.length }</span>
                    </div>
                    <div class="ps-progress-bar-bg">
                        <div class="ps-progress-bar-fill" :style="{ width: progressPercent + '%' }"></div>
                    </div>
                </div>
            </aside>

            <!-- Panel principal -->
            <main class="ps-main">

                <!-- Banner solo lectura -->
                <div v-if="!canEdit" class="ps-readonly-banner">
                    <i class="fas fa-lock"></i>
                    Este formulario está en modo solo lectura (proceso cerrado).
                </div>

                <!-- Header de la sección -->
                <div class="ps-section-header">
                    <div class="ps-section-header-row">
                        <span class="ps-section-number">${ currentSection.order }</span>
                        <h2 class="ps-section-title">${ currentSection.name }</h2>
                        <span v-if="!canEdit" class="ps-readonly-badge">🔒 Solo lectura</span>
                    </div>
                    <div v-if="currentSection.conditionNote" class="ps-section-condition-note">
                        <i class="fas fa-eye"></i> ${ currentSection.conditionNote }
                    </div>
                    <div v-if="currentSection.skipable && formState.skipContact" class="ps-section-skip-note">
                        <i class="fas fa-forward"></i> ${ currentSection.skipNote }
                    </div>
                </div>

                <!-- Preguntas de la sección -->
                <div class="ps-questions">
                    <div
                        v-for="(q, qi) in currentSection.questions"
                        :key="qi"
                        class="ps-question"
                        :class="{ 'ps-question--highlight': q.highlight }"
                    >
                        <div class="ps-question-header">
                            <span class="ps-q-number">${ qi + 1 }</span>
                            <label class="ps-q-label">
                                ${ q.label }
                                <span v-if="q.highlight" class="ps-q-highlight-tag">gatillo</span>
                            </label>
                        </div>

                        <!-- Condicional visible note -->
                        <div v-if="q.conditional" class="ps-q-conditional">
                            <i class="fas fa-eye-slash"></i> Visible: ${ q.conditional }
                        </div>

                        <!-- Input según tipo -->
                        <div class="ps-q-input">
                            <!-- single / opciones -->
                            <div v-if="q.type === 'single' || q.type === 'multiple'" class="ps-btn-group">
                                <button
                                    v-for="opt in q.options"
                                    :key="opt"
                                    class="ps-opt-btn"
                                    :class="{ 'ps-opt-btn--active': mockAnswers[currentSectionIdx + '_' + qi] === opt || (Array.isArray(mockAnswers[currentSectionIdx + '_' + qi]) && mockAnswers[currentSectionIdx + '_' + qi].includes(opt)) }"
                                    :disabled="!canEdit"
                                    @click="toggleAnswer(currentSectionIdx, qi, opt, q.type)"
                                >
                                    ${ opt }
                                </button>
                            </div>

                            <!-- boolean -->
                            <div v-else-if="q.type === 'boolean'" class="ps-bool-group">
                                <button class="ps-bool-btn"
                                    :class="{ 'ps-bool-btn--active': mockAnswers[currentSectionIdx + '_' + qi] === true }"
                                    :disabled="!canEdit"
                                    @click="mockAnswers[currentSectionIdx + '_' + qi] = true">
                                    Sí
                                </button>
                                <button class="ps-bool-btn"
                                    :class="{ 'ps-bool-btn--active': mockAnswers[currentSectionIdx + '_' + qi] === false }"
                                    :disabled="!canEdit"
                                    @click="mockAnswers[currentSectionIdx + '_' + qi] = false">
                                    No
                                </button>
                            </div>

                            <!-- text -->
                            <textarea v-else-if="q.type === 'text'"
                                class="ps-textarea"
                                :disabled="!canEdit"
                                v-model="mockAnswers[currentSectionIdx + '_' + qi]"
                                rows="2"
                                :placeholder="canEdit ? 'Escribir respuesta...' : '—'">
                            </textarea>

                            <!-- date -->
                            <input v-else-if="q.type === 'date'"
                                type="date"
                                class="ps-input"
                                :disabled="!canEdit"
                                v-model="mockAnswers[currentSectionIdx + '_' + qi]"
                            />
                        </div>

                        <!-- Nota de gatillo -->
                        <div v-if="q.note" class="ps-q-note">
                            <i class="fas fa-info-circle"></i> ${ q.note }
                        </div>
                    </div>
                </div>

                <!-- Barra de navegación -->
                <div class="ps-nav">
                    <button class="ps-btn-prev"
                        :disabled="currentSectionIdx === 0"
                        @click="goPrev">
                        ← Anterior
                    </button>
                    <button class="ps-btn-next"
                        @click="goNext">
                        <span v-if="isLastSection && canEdit">Guardar sesión ✓</span>
                        <span v-else-if="isLastSection && !canEdit">Cerrar</span>
                        <span v-else>Siguiente →</span>
                    </button>
                </div>

            </main>
        </div>

        <!-- ── Área principal (modo real) — componente DinamicForm ────────── -->
        <dinamic-form
            v-else-if="formId && submissionId"
            :form-id="formId"
            :submission-id="submissionId"
            :can-edit="canEdit"
            :form-state="formState"
            @form-completed="onFormCompleted"
            @answers-updated="onAnswersUpdated">
        </dinamic-form>

        <!-- ── Overlay de sesión completada ─────────────────────────────── -->
        <div v-if="sessionCompleted" class="ps-completed-backdrop">
            <div class="ps-completed-card">
                <div class="ps-completed-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" fill="#22c55e"/>
                        <path d="M7 12.5l3.5 3.5 6-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <!-- Variante: Primer Contacto con Continuar = Sí -->
                <template v-if="completedVariant === 'continuar_pa'">
                    <h4 class="ps-completed-title">Primer Contacto guardado</h4>
                    <p class="ps-completed-text">Continúa con el registro de la Primera Atención.</p>
                    <button class="ps-completed-btn ps-completed-btn--secondary" @click="resetMock">
                        ← Volver a casos de prueba
                    </button>
                    <button class="ps-completed-btn" @click="simularContinuar">
                        Iniciar Primera Atención →
                    </button>
                </template>

                <!-- Variante: Solo Contacto -->
                <template v-else-if="completedVariant === 'solo_contacto'">
                    <h4 class="ps-completed-title">Contacto registrado</h4>
                    <p class="ps-completed-text">El contacto fue registrado. La próxima sesión queda pendiente de agendar.</p>
                    <button class="ps-completed-btn" @click="resetMock">
                        ← Volver a casos de prueba
                    </button>
                </template>

                <!-- Variante: Cierre -->
                <template v-else-if="completedVariant === 'cierre'">
                    <h4 class="ps-completed-title">Proceso cerrado</h4>
                    <p class="ps-completed-text">El proceso psicosocial fue cerrado exitosamente.</p>
                    <button class="ps-completed-btn" @click="resetMock">
                        ← Volver a casos de prueba
                    </button>
                </template>

                <!-- Variante: sesión normal (mock) -->
                <template v-else-if="isMock">
                    <h4 class="ps-completed-title">Sesión registrada</h4>
                    <p class="ps-completed-text">La sesión fue registrada exitosamente.</p>
                    <button class="ps-completed-btn" @click="resetMock">
                        ← Volver a casos de prueba
                    </button>
                </template>

                <!-- Variante: sesión normal (real) -->
                <template v-else>
                    <h4 class="ps-completed-title">Sesión registrada</h4>
                    <p class="ps-completed-text">La sesión fue registrada exitosamente.</p>
                    <button class="ps-completed-btn" @click="goToRemision">
                        Ver remisión
                    </button>
                </template>
            </div>
        </div>

        </template><!-- /v-else pageLoading -->

    </div><!-- /#psicosocial-app -->
</div>

<script src="/static/js/psicosocial/mock_psicosocial.js"></script>

<script>
    // ── Detectar modo mock ──────────────────────────────────────────────
    const urlParams  = new URLSearchParams(window.location.search);
    const mockCasoId = urlParams.get('mock');   // ej: 'caso1'
    const IS_MOCK     = !!mockCasoId;

    // ── Labels de estado ────────────────────────────────────────────────
    const RISK_LABELS = { 0: 'Sin dato', 1: 'Bajo', 2: 'Medio', 3: 'Alto', 4: 'Extremo' };

    // ── Config de ubicación de barreras por formulario ───────────────────
    // La sección "Identificación de Barreras" existe clonada en cada uno de los 4
    // formularios psicosociales, con su propio repeater group y preguntas de
    // Departamento/Ciudad (mismo patrón que hacer_seguimiento.html, pero un config
    // distinto por formId ya que los IDs de pregunta/repeater no se comparten entre forms).
    const PSICO_BARRIER_LOCATION_CONFIG = {
        '439b57e6-07ea-4da4-9721-8ed28c6ca43f': { // Primer Contacto Psicosocial
            groupId: '4e9a169b-76d7-4f4d-ab9d-c807cff457d5',
            deptQ:   'e95358fa-f413-4521-9b20-2b1a8eeb9ea5',
            cityQ:   '3583a842-1c51-499c-a1ee-9b94d95aa7db',
        },
        '501ab3d7-8382-4447-96a6-f463152693c6': { // Primera Atención Psicosocial
            groupId: 'b7fe655d-7e4e-4f67-b997-a1bf7512210e',
            deptQ:   '87ed2814-8590-419b-a463-0109b1f4cfe2',
            cityQ:   '0bd19847-748c-4c7e-9b78-92de08f0a2c4',
        },
        '7a7b61b3-7bc3-4088-a74d-0974e54a3563': { // Atención Psicosocial
            groupId: '0fbc7da0-8349-4bcd-acd2-da3c5240b4cd',
            deptQ:   'ebea5f98-11cc-484b-84c9-adde4d88e3a5',
            cityQ:   '672848b1-507b-47d5-9b09-d2dabf8d4617',
        },
        'c31026f8-7ce2-49b9-8990-04b44ed4513c': { // Cierre Psicosocial
            groupId: 'cb9b49e5-91f0-430e-9c0f-dc0235ef396f',
            deptQ:   '99adb055-39dd-4ee2-ae7f-16633d2c123d',
            cityQ:   '2cf2d66b-d435-4b77-8e5b-7a09b5535a05',
        },
    };

    var app = Vue.createApp({
        delimiters: ['${', '}'],
        data() {
            return {
                // ── Datos de identificación ──────────────────────────
                psicosocialId: '{{ .psicosocialId }}',
                userICode:     '{{ .userICode }}',
                isMock:        IS_MOCK,

                // ── Estado de carga ──────────────────────────────────
                pageLoading:   true,
                loadError:     null,

                // ── Datos del proceso psicosocial ────────────────────
                formId:          null,
                submissionId:    null,
                formType:        null,
                victimInfo:      null,
                psicosocialState: {
                    yaHizoPrimerContacto:  false,
                    yaHizoPrimeraAtencion: false,
                    sessionCount:          0,
                    status:                'abierto',
                },
                formState:   { skipContact: false, statesColombia: [], newBarriers: [] },
                canEdit:     true,

                // ── Ubicación de barreras (Identificación de Barreras) ────
                allCities:      [],   // [{ label, value, departmentId }] — para filtrado local
                _deptCityCache: {},   // { [idx]: deptId } — evita re-filtrar ciudades sin cambio
                _townCityCache: {},   // { [idx]: cityId } — evita re-fetch redundante de municipios

                // ── Secciones del formulario (mock preview) ──────────
                sections:        [],

                // ── Navegación de secciones ──────────────────────────
                currentSectionIdx: 0,
                answeredSections:  {},

                // ── Respuestas mock para demo ────────────────────────
                mockAnswers:       {},

                // ── Estado de completado ─────────────────────────────
                sessionCompleted:  false,
                completedVariant:  'default',
            };
        },

        computed: {
            riskLabel() {
                return RISK_LABELS[this.victimInfo?.RiskLevel] || '—';
            },
            statusInfo() {
                return window.PSICO_MOCK.STATUS_LABELS[this.psicosocialState.status]
                    || { label: this.psicosocialState.status, color: '#6b7280', bg: '#f9fafb' };
            },
            formTypeLabel() {
                return window.PSICO_MOCK.FORM_TYPE_LABELS[this.formType] || this.formType || '—';
            },
            sectionsToShow() {
                if (!this.sections.length) return [];
                if (this.formState.skipContact) {
                    return this.sections.filter(s => !s.skipable);
                }
                return this.sections;
            },
            currentSection() {
                return this.sectionsToShow[this.currentSectionIdx] || {};
            },
            isLastSection() {
                return this.currentSectionIdx === this.sectionsToShow.length - 1;
            },
            firstPendingIdx() {
                const answered = Object.keys(this.answeredSections).map(Number);
                if (answered.length === 0) return 0;
                return Math.min(answered.length, this.sectionsToShow.length - 1);
            },
            progressPercent() {
                if (!this.sectionsToShow.length) return 0;
                return Math.round((Object.keys(this.answeredSections).length / this.sectionsToShow.length) * 100);
            },
        },

        mounted() {
            document.getElementById('app').style.display = 'block';
            if (IS_MOCK) {
                this.loadMockData(mockCasoId);
            } else {
                this.loadPsicosocial();
                this.loadLocations();
            }
        },

        methods: {
            // ── Carga de datos ─────────────────────────────────────
            loadMockData(casoId) {
                const caso = window.PSICO_MOCK.getCaso(casoId);
                if (!caso) {
                    this.loadError = `Caso mock "${casoId}" no encontrado.`;
                    this.pageLoading = false;
                    return;
                }
                this.formId          = caso.formId;
                this.submissionId    = caso.submissionId;
                this.formType        = caso.formType;
                this.victimInfo      = caso.victimInfo;
                this.psicosocialState = { ...caso.psicosocialState };
                this.formState       = { ...caso.formState };
                this.canEdit         = caso.canEdit;
                this.sections        = caso.sections;
                this.pageLoading     = false;
            },

            async loadPsicosocial() {
                try {
                    const url  = `/api/v1/psychosocial-support/${this.psicosocialId}/load?agent_id=${this.userICode}`;
                    const res  = await fetch(url);
                    const data = await res.json();
                    if (!res.ok) {
                        this.loadError = data.error || 'Error al cargar la sesión psicosocial';
                        return;
                    }
                    this.formId           = data.formId;
                    this.submissionId     = data.submissionId;
                    this.formType         = data.formType;
                    this.victimInfo       = data.victimInfo;
                    this.psicosocialState = data.psicosocialState;
                    // Merge (no reemplaza) para no perder statesColombia/newBarriers que
                    // loadLocations() puede haber poblado en paralelo (ambas se disparan juntas
                    // en mounted() y no hay orden garantizado de resolución).
                    this.formState        = { ...this.formState, ...(data.formState || {}) };
                    this.canEdit          = data.psicosocialState.status !== 'cerrado';
                    console.log('[PSICO] Datos cargados:', data);
                } catch (e) {
                    this.loadError = 'Error de conexión al cargar la sesión psicosocial';
                    console.error('[PSICO] error:', e);
                } finally {
                    this.pageLoading = false;
                }
            },

            // ── Ubicaciones para el repeater "Identificación de Barreras" ─
            async loadLocations() {
                try {
                    const [deptRes, cityRes] = await Promise.all([
                        fetch('/api/v1/locations/departments'),
                        fetch('/api/v1/locations/cities'),
                    ]);
                    if (deptRes.ok) this.formState.statesColombia = await deptRes.json();
                    if (cityRes.ok) this.allCities = await cityRes.json();
                } catch (e) {
                    console.warn('[PSICO] loadLocations error:', e);
                }
            },

            // ── Evento del componente DinamicForm (flujo real) ─────
            onFormCompleted() {
                this.completedVariant = 'default';
                this.sessionCompleted = true;
            },
            onAnswersUpdated(payload) {
                this._updateBarreraLocationOptions(payload);
            },
            // Filtra las entries del repeater "Identificación de Barreras" (según el formId
            // actual) y va poblando formState.newBarriers[i].cities/.towns a medida que el
            // agente elige Departamento → Ciudad, tal como lo hace hacer_seguimiento.html.
            _updateBarreraLocationOptions(payload) {
                const cfg = PSICO_BARRIER_LOCATION_CONFIG[this.formId];
                if (!cfg) return;

                const entries = (payload.answers?.repeaterEntries || [])
                    .filter(e => e.repeaterGroupId === cfg.groupId);

                if (!Array.isArray(this.formState.newBarriers)) this.formState.newBarriers = [];
                while (this.formState.newBarriers.length < entries.length) {
                    this.formState.newBarriers.push({ cities: [], towns: [] });
                }

                entries.forEach((entry, idx) => {
                    const getEntryVal = qId => (entry.answers.find(a => a.questionId === qId)?.value || '');
                    const deptId = getEntryVal(cfg.deptQ);
                    const cityId = getEntryVal(cfg.cityQ);

                    const cachedDept = this._deptCityCache[idx] || '';
                    if (String(deptId) !== String(cachedDept)) {
                        this._deptCityCache[idx] = deptId;
                        this.formState.newBarriers[idx].cities = deptId
                            ? this.allCities
                                .filter(c => String(c.departmentId) === String(deptId))
                                .map(c => ({ label: c.label, value: c.value }))
                            : [];
                    }

                    const cachedCity = this._townCityCache[idx] || '';
                    if (String(cityId) !== String(cachedCity)) {
                        this._townCityCache[idx] = cityId;
                        if (cityId) {
                            fetch(`/api/v1/locations/towns?city_id=${cityId}`)
                                .then(r => r.json())
                                .then(towns => { this.formState.newBarriers[idx].towns = towns; })
                                .catch(() => { this.formState.newBarriers[idx].towns = []; });
                        } else {
                            this.formState.newBarriers[idx].towns = [];
                        }
                    }
                });
            },
            goToRemision() {
                window.location.href = `/salvia/remision-psicosocial/${this.psicosocialId}`;
            },

            // ── Navegación de secciones ────────────────────────────
            goToSection(idx) {
                if (idx > this.firstPendingIdx) return;
                this.currentSectionIdx = idx;
            },
            goPrev() {
                if (this.currentSectionIdx > 0) this.currentSectionIdx--;
            },
            goNext() {
                if (!this.isLastSection) {
                    this.answeredSections = {
                        ...this.answeredSections,
                        [this.currentSectionIdx]: true,
                    };
                    this.currentSectionIdx++;
                } else {
                    this.saveSession();
                }
            },

            // ── Respuestas mock ────────────────────────────────────
            toggleAnswer(secIdx, qIdx, opt, type) {
                const key = `${secIdx}_${qIdx}`;
                if (type === 'single') {
                    this.mockAnswers = { ...this.mockAnswers, [key]: opt };
                } else {
                    const current = Array.isArray(this.mockAnswers[key]) ? [...this.mockAnswers[key]] : [];
                    const pos = current.indexOf(opt);
                    if (pos >= 0) current.splice(pos, 1); else current.push(opt);
                    this.mockAnswers = { ...this.mockAnswers, [key]: current };
                }
            },

            // ── Guardar sesión (mock) ──────────────────────────────
            saveSession() {
                this.answeredSections = {
                    ...this.answeredSections,
                    [this.currentSectionIdx]: true,
                };

                // Determinar variante del overlay
                if (this.formType === 'PRIMER_CONTACTO') {
                    // Buscar si "Continuar Primera Atención" = Sí en las respuestas
                    const lastSecIdx  = this.sectionsToShow.length - 1;
                    const lastSec     = this.sectionsToShow[lastSecIdx] || {};
                    const lastQ       = (lastSec.questions || []).length - 1;
                    const gatillo     = this.mockAnswers[`${lastSecIdx}_${lastQ}`];
                    this.completedVariant = (gatillo === true) ? 'continuar_pa' : 'default';
                } else if (this.formType === 'CIERRE') {
                    this.completedVariant = 'cierre';
                } else {
                    this.completedVariant = 'default';
                }

                this.sessionCompleted = true;
            },

            // ── Acciones del overlay ───────────────────────────────
            simularContinuar() {
                // Simula la carga del caso3 (Primera Atención con skipContact = true)
                window.location.href = '/salvia/psicosocial/registrar/mock?mock=caso3';
            },
            resetMock() {
                window.location.href = '/salvia/test-psicosocial';
            },
        },
    });
</script>
