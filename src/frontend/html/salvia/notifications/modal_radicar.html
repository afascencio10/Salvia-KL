{{ define "notifications/modal_radicar.html" }}
{{/* Modal: Radicar oficio — estado para_radicar
     Rol habilitado: Agente de Notificaciones
     El agente radica el oficio ante la entidad correspondiente y registra el número de radicado. */}}

<div v-if="showModal && activeModal === 'radicar'" class="nf-modal-overlay" @click.self="closeModal">
    <div class="nf-modal">

        <div class="nf-modal-header">
            <h5>Radicar oficio</h5>
            <button class="nf-modal-close" @click="closeModal">&times;</button>
        </div>

        <div class="nf-modal-body">

            <p class="nf-modal-desc" v-if="selectedOficio">
                ${ selectedOficio.title }
            </p>

            <div class="nf-modal-form-row">
                <div class="nf-modal-form-group">
                    <label class="nf-modal-label">
                        Asunto <span class="nf-required">*</span>
                    </label>
                    <input
                        v-model="modalForm.asunto"
                        type="text"
                        class="form-control nf-modal-input"
                        placeholder="Ej: Solicitud de celeridad en proceso penal">
                </div>
            </div>

            <div class="nf-modal-form-row nf-two-cols">
                <div class="nf-modal-form-group">
                    <label class="nf-modal-label">
                        Correo entidad <span class="nf-required">*</span>
                    </label>
                    <input
                        v-model="modalForm.correoEntidad"
                        type="email"
                        class="form-control nf-modal-input"
                        :placeholder="selectedOficio ? selectedOficio.correo : 'correo@entidad.gov.co'">
                </div>

                <div class="nf-modal-form-group">
                    <label class="nf-modal-label">
                        Número radicado <span class="nf-required">*</span>
                    </label>
                    <input
                        v-model="modalForm.numeroRadicado"
                        type="text"
                        class="form-control nf-modal-input"
                        placeholder="Ej: 2026-FGN-00415">
                </div>
            </div>

            <div class="nf-modal-form-group">
                <label class="nf-modal-label">
                    Ruta del oficio en el Kofax <span class="nf-required">*</span>
                </label>
                <input
                    v-model="modalForm.kofaxPath"
                    type="text"
                    class="form-control nf-modal-input"
                    placeholder="Ej: Oficios/2026/Justicia/OF-005">
            </div>

            <div class="nf-modal-footer">
                <button class="btn nf-btn-modal-cancel" @click="closeModal">Cancelar</button>
                <button class="btn nf-btn-modal-primary" @click="submitModal('radicar')">
                    Marcar oficio como radicado
                </button>
            </div>

        </div>
    </div>
</div>
{{ end }}
