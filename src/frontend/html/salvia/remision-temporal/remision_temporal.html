<main class="salvia-main">
<div class="container">
    <div class="welcome-section">
        <div>
            <h2><b>Remisión Psicosocial</b></h2>
            <p class="text-muted mb-0">Gestión de contacto 3x3</p>
        </div>
    </div>

    <div class="mt-4 mb-4">
        <psychosocial-contact-card
            :psicosocial-id="psicosocialId"
            :current-user="currentUser"
            :current-user-id="currentUserId"
            :user-team="userTeam">
        </psychosocial-contact-card>
    </div>
</div>
</main>

{{ template "standard_scripts.html" . }}
{{ template "overlay.html" . }}

<script>
    var home = Vue.createApp({
        delimiters: ['${', '}'],
        data: function() {
            return {
                windowTitle: {{.windowTitle}},
                currentUser: "{{.currentUser}}",
                currentRole: "{{.currentRole}}",
                currentUserId: "{{.currentUserId}}",
                userTeam: "",
                psicosocialId: "{{.psicosocialId}}",
            };
        },
        mounted: function() {
            document.title = {{.windowTitle}};
            document.getElementById('app').style.display = 'block';
        },
        methods: {
            logout: function() {
                logout("/seguridad/logout");
            },
        },
    });

    var app = home;
</script>

<script src="/static/js/components/dinamic-form.js"></script>
<script src="/static/js/components/psychosocial-contact-modal.js"></script>
<script src="/static/js/components/psychosocial-contact-card.js"></script>

<script>
    home.mount("#app");
</script>
