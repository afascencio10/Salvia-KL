<main class="salvia-main">
<div class="container">
    <div class="welcome-section">
        <div>
            <h2><b>Mis Remisiones — Medidas de Emergencia</b></h2>
            <p class="text-muted mb-0">Remisiones asignadas a tu perfil</p>
        </div>
    </div>

    {{ template "salvia/remisiones-medidas/remisiones_medidas_component.html" . }}

    <div class="mt-4 mb-4">
        <remisiones-medidas-component
            vista="agente"
            agente-id="{{.agentICode}}"
            @ver-caso="onVerCaso"
            @ver-detalle="onVerDetalle"
        ></remisiones-medidas-component>
    </div>
</div>
</main>

{{ template "standard_scripts.html" . }}
{{ template "overlay.html" . }}

<script>
    var home = Vue.createApp({
        delimiters: ['${', '}'],
        data: function() {
            return {
                windowTitle: {{.windowTitle}},
                currentUser: "{{.currentUser}}",
                currentRole: "{{.currentRole}}",
                menu: {{.menu}},
            };
        },
        mounted: function() {
            document.title = {{.windowTitle}};
            document.getElementById('app').style.display = 'block';
        },
        methods: {
            onVerCaso: function() {},
            onVerDetalle: function(payload) {
                var remisionId = payload && payload.remisionId;
                if (remisionId) {
                    window.location.href = '/salvia/remision-medida/' + encodeURIComponent(remisionId);
                }
            },
            logout: function() {
                logout("/seguridad/logout");
            },
        },
    });

    var app = home;

    var _tplRme = document.getElementById('tpl-remisiones-medidas-component');
    window.__remisionesMedidasComponentTpl = _tplRme ? _tplRme.innerHTML : '';
</script>

<script src="/static/js/components/remisiones-medidas-component.js"></script>

<script>
    home.mount("#app");
</script>
