<main class="salvia-main">
<div class="container">
    <div class="welcome-section">
        <div>
            <h2><b>Mis remisiones Psicosocial</b></h2>
            <p class="text-muted mb-0">Remisiones asignadas a ${ currentUser }</p>
        </div>
    </div>

    {{ template "salvia/remisiones-psicosocial/remisiones_psicosocial_component.html" . }}

    <div class="mt-4 mb-4">
        <remisiones-psicosocial-component
            ref="remisionesComponent"
            :mostrar-cards="false"
            :reasignacion="false"
            :mostrar-filtro-dupla="false"
            :mostrar-filtro-profesional="false"
            :default-filter="defaultFilter"
            @ver-caso="onVerCaso"
            @ver-remision="onVerRemision"
        ></remisiones-psicosocial-component>
    </div>
</div>
</main>

{{ template "standard_scripts.html" . }}
{{ template "overlay.html" . }}

<script>
    var home = Vue.createApp({
        delimiters: ['${', '}'],
        data: function() {
            return {
                windowTitle: {{.windowTitle}},
                currentUser: "{{.currentUser}}",
                currentRole: "{{.currentRole}}",
                currentUserId: "{{.currentUserId}}",
                menu: {{.menu}},
                defaultFilter: {
                    professional_id: "{{.currentUserId}}",
                },
            };
        },
        mounted: function() {
            document.title = {{.windowTitle}};
            document.getElementById('app').style.display = 'block';
        },
        methods: {
            onVerCaso: function(payload) {
                var code = payload && payload.caseICode;
                if (code) {
                    window.location.href = '/salvia/casos/' + encodeURIComponent(code) + '/detalle';
                }
            },
            onVerRemision: function(payload) {
                var remisionId = payload && payload.remisionId;
                if (remisionId) {
                    window.location.href = '/salvia/remision-psicosocial/' + encodeURIComponent(remisionId);
                }
            },
            logout: function() {
                logout("/seguridad/logout");
            },
        },
    });

    var app = home;

    var _tplRps = document.getElementById('tpl-remisiones-psicosocial-component');
    window.__remisionesPsicosocialComponentTpl = _tplRps ? _tplRps.innerHTML : '';
</script>

<script src="/static/js/components/remisiones-psicosocial-component.js"></script>

<script>
    home.mount("#app");
</script>
