<label v-if="'{{.InputType}}' != 'hidden'" class= "{{.InputLabelClass}}" for="{{.InputId}}">{{.InputLabel}} <span v-if="{{.Mandatory}}" class="mandatory">*</span></label>
<div :class="errors.{{.EntityName}}&&errors.{{.EntityName}}.{{.EntityAttr}} ? '{{.InputErrorClass}}' : ''">
    <input v-model="{{.EntityPath}}.{{.EntityName}}.{{.EntityAttr}}" type="{{.InputType}}" class="{{.InputClass}}" id="{{.InputId}}" placeholder="{{.InputPlaceHolder}}"
    :aria-invalid="errors.{{.EntityName}} && errors.{{.EntityName}}.{{.EntityAttr}} ? 'true' : 'false'"
    :aria-describedby="errors.{{.EntityName}} && errors.{{.EntityName}}.{{.EntityAttr}} ? '{{.ErrorSpanId}}' : null"
    data-entity="{{.EntityName}}"
    data-field="{{.EntityAttr}}"
    data-label="{{.InputLabel}}">
    <span v-if="errors.{{.EntityName}}&&errors.{{.EntityName}}.{{.EntityAttr}}" id="{{.ErrorSpanId}}" class="error_label">${errors.{{.EntityName}}.{{.EntityAttr}}}</span>
</div>
