name: Deploy to Windows Server (Testing)

on:
  push:
    branches:
      - testing

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: |
          cd src
          go build -o ../salvia.exe main.go

      - name: Deploy Local
        shell: powershell
        run: |
          # 1. Matar por nombre de proceso (todas las instancias)
          taskkill /F /IM salvia.exe /T 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "No se encontro proceso salvia.exe por nombre, continuando..."
          } else {
              Write-Host "Proceso salvia.exe detenido por nombre."
          }

          # 1b. Matar lo que sea que este ocupando el puerto 443 (por si acaso)
          $portPid = (netstat -ano | findstr ":443 ") | ForEach-Object {
              ($_ -split '\s+')[-1]
          } | Select-Object -First 1
          if ($portPid -and $portPid -match '^\d+$' -and $portPid -ne '0') {
              Write-Host "Matando proceso PID $portPid que ocupa el puerto 443..."
              taskkill /F /PID $portPid 2>&1 | Out-Null
          } else {
              Write-Host "Puerto 443 libre."
          }

          # Esperar un momento para que el OS libere el puerto completamente
          Start-Sleep -Seconds 3
          
          # 2. Asegurar que la ruta base existe
          $basePath = "C:\salvia"
          if (!(Test-Path $basePath)) { 
              New-Item -Path $basePath -ItemType Directory 
          }
          
          # 3. BACKUP: Si ya existe un salvia.exe, renombrarlo con fecha y hora
          $exePath = Join-Path $basePath "salvia.exe"
          if (Test-Path $exePath) {
              $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
              $backupName = "salvia_$timestamp.exe"
              $backupPath = Join-Path $basePath $backupName
              Write-Host "Creando backup: $backupName"
              Move-Item -Path $exePath -Destination $backupPath -Force
          }
          
          # 4. Asegurar que la carpeta de certificados existe
          $certsPath = Join-Path $basePath "certs"
          if (!(Test-Path $certsPath)) { 
              New-Item -Path $certsPath -ItemType Directory 
          }

          # 5. Copiar el nuevo binario y scripts
          Copy-Item "salvia.exe" -Destination $exePath -Force
          Copy-Item "salvia.bat" -Destination (Join-Path $basePath "salvia.bat") -Force

          # 6. Copiar certificados (asegurando que esten presentes en el servidor)
          Copy-Item "src/certs/*" -Destination $certsPath -Recurse -Force

      - name: Summary
        run: |
          echo "Despliegue finalizado en C:\salvia. El proceso previo ha sido detenido si estaba en ejecucion."
          echo "Iniciando nueva ventana de consola..."

      - name: Start Application
        shell: powershell
        run: |
          cd C:\salvia
          # Inicia el script en una nueva ventana que permanece abierta (/k)
          Start-Process cmd.exe -ArgumentList "/k C:\salvia\salvia.bat"
