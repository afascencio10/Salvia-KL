name: Deploy to Windows Server (Testing)

on:
  push:
    branches:
      - testing

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: |
          cd src
          go build -o ../salvia.exe main.go

      - name: Deploy Local
        shell: powershell
        run: |
          # Evitar que errores de comandos externos detengan el script
          $ErrorActionPreference = 'Continue'

          # 1. Matar por nombre de proceso (todas las instancias)
          taskkill /F /IM salvia.exe /T 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "No se encontro proceso salvia.exe por nombre, continuando..."
          } else {
              Write-Host "Proceso salvia.exe detenido por nombre."
          }

          # 1b. Solo matar si hay algo en estado LISTENING en :443 (ignora TIME_WAIT)
          $netstatLine = netstat -ano | findstr "LISTENING" | findstr ":443 " | Select-Object -First 1
          if ($netstatLine) {
              $portPid = ($netstatLine.Trim() -split '\s+')[-1]
              if ($portPid -and $portPid -match '^\d+$' -and $portPid -ne '0') {
                  Write-Host "Puerto 443 LISTENING por PID $portPid, intentando matar..."
                  taskkill /F /PID $portPid 2>&1 | Out-Null
                  Write-Host "Kill PID $portPid ejecutado (exit: $LASTEXITCODE)"
              }
          } else {
              Write-Host "Puerto 443 libre (no hay LISTENING)."
          }

          # Esperar para que el OS libere el puerto completamente
          Start-Sleep -Seconds 3
          
          # 2. Asegurar que la ruta base existe
          $basePath = "C:\salvia"
          if (!(Test-Path $basePath)) { 
              New-Item -Path $basePath -ItemType Directory 
          }
          
          # 3. BACKUP: Si ya existe un salvia.exe, renombrarlo con fecha y hora
          $exePath = Join-Path $basePath "salvia.exe"
          if (Test-Path $exePath) {
              $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
              $backupName = "salvia_$timestamp.exe"
              $backupPath = Join-Path $basePath $backupName
              Write-Host "Creando backup: $backupName"
              Move-Item -Path $exePath -Destination $backupPath -Force
          }
          
          # 4. Asegurar que la carpeta de certificados existe
          $certsPath = Join-Path $basePath "certs"
          if (!(Test-Path $certsPath)) { 
              New-Item -Path $certsPath -ItemType Directory 
          }

          # 5. Copiar el nuevo binario (siempre debe existir tras el build)
          Copy-Item "salvia.exe" -Destination $exePath -Force
          Write-Host "salvia.exe copiado a $exePath"

          # 6. Copiar salvia.bat solo si existe en el repo
          if (Test-Path "salvia.bat") {
              Copy-Item "salvia.bat" -Destination (Join-Path $basePath "salvia.bat") -Force
              Write-Host "salvia.bat copiado."
          } else {
              Write-Host "salvia.bat no esta en el repo, se conserva el del servidor."
          }

          # 7. Copiar certificados solo si existen en el repo
          if (Test-Path "src/certs") {
              $certFiles = Get-ChildItem "src/certs" -ErrorAction SilentlyContinue
              if ($certFiles) {
                  Copy-Item "src/certs/*" -Destination $certsPath -Recurse -Force
                  Write-Host "Certificados copiados."
              } else {
                  Write-Host "src/certs esta vacio, se conservan los certs del servidor."
              }
          } else {
              Write-Host "src/certs no esta en el repo, se conservan los certs del servidor."
          }

      - name: Summary
        run: |
          echo "Despliegue finalizado en C:\salvia. El proceso previo ha sido detenido si estaba en ejecucion."
          echo "Iniciando nueva ventana de consola..."

      - name: Start Application
        shell: powershell
        run: |
          cd C:\salvia
          # Inicia el script en una nueva ventana que permanece abierta (/k)
          Start-Process cmd.exe -ArgumentList "/k C:\salvia\salvia.bat"
